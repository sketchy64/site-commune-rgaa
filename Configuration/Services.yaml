services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Commune\SiteCommuneRgaa\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Innogam/Dto/*'
      - '../Classes/Innogam/Exception/*'

  Commune\SiteCommuneRgaa\EventListener\NewsPublishedEventListener:
    tags:
      - name: event.listener
        identifier: 'site-commune-rgaa/news-post-persist-listener'
        event: GeorgRinger\News\Event\NewsPostPersistEvent

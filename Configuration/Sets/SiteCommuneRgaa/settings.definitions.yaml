categories:
  # ============================================================================
  # NIVEAU 1 : CATÉGORIE RACINE
  # ============================================================================
  commune_root:
    label: 'Site Collectivité RGAA'
    description: 'Configuration globale et personnalisation du portail communal'

  # ============================================================================
  # NIVEAU 2 : SOUS-CATÉGORIES
  # ============================================================================
  commune_theme:
    label: 'Apparence & Thèmes'
    description: 'Sélection de la charte graphique et de la feuille de style'
    parent: commune_root

  commune_identity:
    label: 'Identité & Marque'
    description: 'Dénomination officielle, armoiries, devises et logo'
    parent: commune_root

  commune_contact:
    label: 'Coordonnées & Horaires'
    description: 'Adresse postale, téléphone, e-mail et horaires d''accueil'
    parent: commune_root

  commune_home:
    label: 'Page d''accueil'
    description: 'Configuration des sections et zones de la page d''accueil'
    parent: commune_root

  commune_news:
    label: 'Actualités'
    description: 'Configuration de l''affichage des listes et carrousels d''actualités'
    parent: commune_root

  commune_a11y:
    label: 'Accessibilité Numérique & RGAA'
    description: 'Statut de conformité légale RGAA 4.1.2 et déclaration obligatoire'
    parent: commune_root

  commune_footer:
    label: 'Pied de page & Navigation'
    description: 'Configuration des colonnes du footer, bouton contact, plan et liens'
    parent: commune_root

  commune_app:
    label: 'Application Mobile (PWA) & Alertes'
    description: 'Installation sur smartphones (iOS / Android) et alertes d''actualités'
    parent: commune_root

  commune_emergency:
    label: 'Numéros d''urgence & Utiles'
    description: 'Numéros d''urgence républicains affichés dans le pied de page'
    parent: commune_root

  commune_social:
    label: 'Réseaux sociaux'
    description: 'Liens d''accès vers les comptes officiels de réseaux sociaux et affichage'
    parent: commune_root

  commune_language:
    label: 'Langues & Multilinguisme'
    description: 'Configuration du sélecteur de langues avec drapeaux dans l''en-tête'
    parent: commune_root

  # ============================================================================
  # NIVEAU 3 : SOUS-SOUS-CATÉGORIES DÉTAILLÉES
  # ============================================================================
  # Sous-catégories de "Identité & Marque"
  commune_identity_general:
    label: 'Nom & Devise'
    description: 'Dénomination officielle de la mairie et devise'
    parent: commune_identity

  commune_identity_logo:
    label: 'Logo & En-tête'
    description: 'Fichier image du logo, hauteur et affichage dans l''en-tête'
    parent: commune_identity

  # Sous-catégories de "Page d'accueil"
  commune_home_sections:
    label: 'Titres des zones'
    description: 'Personnalisation et masquage des titres des sections d''accueil'
    parent: commune_home

  commune_home_sitemap:
    label: 'Plan du site (Accueil)'
    description: 'Affichage et titre de la zone Plan du site sur la page d''accueil'
    parent: commune_home

  # Sous-catégories de "Pied de page & Navigation"
  commune_footer_titles:
    label: 'Titres des colonnes'
    description: 'Intitulés des 3 colonnes du pied de page'
    parent: commune_footer

  commune_footer_contact:
    label: 'Bouton Contacter la mairie'
    description: 'Texte et lien vers la page de contact'
    parent: commune_footer

  commune_footer_map:
    label: 'Plan d''accès / Nous situer'
    description: 'Image et lien vers la page du plan d''accès'
    parent: commune_footer

  commune_footer_links:
    label: 'Dossier des liens utiles'
    description: 'Identifiant du dossier contenant les pages de pied de page'
    parent: commune_footer

settings:
  # ============================================================================
  # 1. APPARENCE & THÈMES
  # ============================================================================
  commune.theme_css:
    label: 'Thème graphique du site'
    description: 'Sélectionnez le style graphique (ex: Thème 1 - Style classique avec arrondis et ombres). Choisissez vide pour Bootstrap Package standard.'
    category: commune_theme
    type: string
    default: 'EXT:site_commune_rgaa/Resources/Public/Css/commune-theme-1.css'
    enum:
      - 'EXT:site_commune_rgaa/Resources/Public/Css/commune-theme-1.css'
      - ''

  commune.color_scheme_css:
    label: 'Jeu de couleurs institutionnel'
    description: 'Sélectionnez la palette de couleurs à appliquer (Jeux de couleurs 1 Vert/Or, 2 Océan/Sable, 3 Montagne/Terracotta, etc.).'
    category: commune_theme
    type: string
    default: 'EXT:site_commune_rgaa/Resources/Public/Css/commune-couleurs-1.css'
    enum:
      - 'EXT:site_commune_rgaa/Resources/Public/Css/commune-couleurs-1.css'
      - 'EXT:site_commune_rgaa/Resources/Public/Css/commune-couleurs-2.css'
      - 'EXT:site_commune_rgaa/Resources/Public/Css/commune-couleurs-3.css'

  commune.enable_theme_switcher:
    label: 'Activer le sélecteur de thème & couleurs sur le frontend (Live Preview)'
    description: 'Affiche un panneau flottant sur toutes les pages frontend permettant de tester en direct les différents thèmes et jeux de couleurs.'
    category: commune_theme
    type: bool
    default: true

  # ============================================================================
  # 2. IDENTITÉ & MARQUE : LOGO & EN-TÊTE
  # ============================================================================
  commune.logo_file:
    label: 'Chemin du logo de la mairie'
    description: 'Fichier image du logo (Ex : fileadmin/logo.svg ou EXT:site_commune_rgaa/Resources/Public/Images/logo.svg)'
    category: commune_identity_logo
    type: string
    default: ''

  commune.logo_height:
    label: 'Hauteur du logo (en pixels)'
    description: 'Hauteur d''affichage du logo dans l''en-tête (Ex : 60)'
    category: commune_identity_logo
    type: int
    default: 60

  commune.header_hide_title:
    label: 'Masquer le nom de la commune dans l''en-tête'
    description: 'Cocher pour masquer le texte du titre si le logo contient déjà le nom'
    category: commune_identity_logo
    type: bool
    default: false

  commune.header_hide_slogan:
    label: 'Masquer le slogan/devise dans l''en-tête'
    category: commune_identity_logo
    type: bool
    default: false

  commune.header_layout:
    label: 'Disposition de l''en-tête et du menu'
    description: 'Sélectionnez le mode d''affichage de l''en-tête (Standard : logo/slogan + recherche dans l''en-tête, menu centré / Intégré : logo/slogan dans le menu à gauche, menu à droite avec bouton de recherche).'
    category: commune_identity_logo
    type: string
    default: 'standard'
    enum:
      - 'standard'
      - 'integrated'

  # ============================================================================
  # 2. IDENTITÉ & MARQUE : NOM & DEVISE
  # ============================================================================
  commune.nom:
    label: 'Nom officiel de la commune / collectivité'
    description: 'Affiché dans l''en-tête, le titre du site et le pied de page'
    category: commune_identity_general
    type: string
    default: 'Mairie de Notre-Commune'

  commune.slogan:
    label: 'Devise ou sous-titre officiel'
    description: 'Exemple : République Française - Liberté, Égalité, Fraternité'
    category: commune_identity_general
    type: string
    default: 'République Française - Liberté, Égalité, Fraternité'

  commune.departement:
    label: 'Département'
    description: 'Exemple : 64 - Pyrénées-Atlantiques'
    category: commune_identity_general
    type: string
    default: '64 - Pyrénées-Atlantiques'

  commune.region:
    label: 'Région'
    description: 'Exemple : Nouvelle-Aquitaine'
    category: commune_identity_general
    type: string
    default: 'Nouvelle-Aquitaine'

  # ============================================================================
  # 3. COORDONNÉES & HORAIRES
  # ============================================================================
  commune.adresse:
    label: 'Adresse postale de la Mairie'
    description: 'Numéro, rue, code postal et ville'
    category: commune_contact
    type: string
    default: '1 Place de la République, 64000 Commune'

  commune.telephone:
    label: 'Numéro de téléphone officiel'
    description: 'Exemple : 05 59 00 00 00'
    category: commune_contact
    type: string
    default: '05 59 00 00 00'

  commune.email:
    label: 'Adresse e-mail de contact'
    description: 'Exemple : contact@notre-commune.fr'
    category: commune_contact
    type: string
    default: 'contact@notre-commune.fr'

  commune.horaires:
    label: 'Horaires d''ouverture au public'
    description: 'Horaires d''accueil de la mairie pour les administrés'
    category: commune_contact
    type: string
    default: 'Du Lundi au Vendredi : 8h30 - 12h00 / 13h30 - 17h30'

  # ============================================================================
  # 4. PAGE D'ACCUEIL : TITRES DES ZONES
  # ============================================================================
  commune.home_hero_search_enable:
    label: 'Afficher la zone de recherche sur le carrousel (Accueil)'
    description: 'Intègre un pavé de recherche au centre par-dessus le carrousel de la page d''accueil (style Ville de Tarnos).'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_quickaccess_title:
    label: 'Titre de la zone Accès rapides'
    description: 'Titre au-dessus des icônes ou démarches'
    category: commune_home_sections
    type: string
    default: 'Accès rapides'

  commune.home_quickaccess_hide_title:
    label: 'Masquer le titre de la zone Accès rapides'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_edito_title:
    label: 'Titre de la zone Édito'
    description: 'Titre de la section Mot du Maire / Édito'
    category: commune_home_sections
    type: string
    default: 'Le mot du Maire'

  commune.home_edito_hide_title:
    label: 'Masquer le titre de la zone Édito'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_featured_news_title:
    label: 'Titre de la zone Actualités à la une'
    description: 'Titre de la section Actualités à la une sur la page d''accueil'
    category: commune_home_sections
    type: string
    default: 'Actualités à la une'

  commune.home_featured_news_hide_title:
    label: 'Masquer le titre de la zone Actualités à la une'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_featured_news_hide_section:
    label: 'Masquer la section Actualités à la une'
    description: 'Permet de désactiver l''affichage de la section Actualités à la une sur l''accueil'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_news_title:
    label: 'Titre de la zone Actualités & Agenda'
    description: 'Titre de la section des actualités et événements municipaux'
    category: commune_home_sections
    type: string
    default: 'Actualités & Agenda municipal'

  commune.home_news_hide_title:
    label: 'Masquer le titre de la zone Actualités & Agenda'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_map_title:
    label: 'Titre de la zone Carte interactive'
    description: 'Titre de la section de découverte et plan interactif'
    category: commune_home_sections
    type: string
    default: 'Plan interactif & Découverte'

  commune.home_map_hide_title:
    label: 'Masquer le titre de la zone Carte interactive'
    category: commune_home_sections
    type: bool
    default: false

  # ============================================================================
  # 4. PAGE D'ACCUEIL : PLAN DU SITE
  # ============================================================================
  commune.home_sitemap_enable:
    label: 'Activer la section Plan du site sur la page d''accueil'
    description: 'Affiche la section du plan du site avant le pied de page'
    category: commune_home_sitemap
    type: bool
    default: true

  commune.home_sitemap_title:
    label: 'Titre de la section Plan du site'
    description: 'Titre de la section du plan du site'
    category: commune_home_sitemap
    type: string
    default: 'Plan du site & Navigation'

  commune.home_sitemap_hide_title:
    label: 'Masquer le titre de la section Plan du site'
    category: commune_home_sitemap
    type: bool
    default: false

  commune.search_page_uid:
    label: 'Page de Recherche (ID / UID)'
    description: 'Identifiant (UID) de la page contenant le formulaire et les résultats de recherche (Ex : 23)'
    category: commune_home_sections
    type: int
    default: 23


  # ============================================================================
  # 5. ACTUALITÉS
  # ============================================================================
  commune.news_list_layout:
    label: 'Disposition des listes d''actualités'
    description: 'Choisissez entre un affichage en colonnes (cartes verticales) ou en ligne (horizontal avec image à gauche).'
    category: commune_news
    type: string
    default: 'cards'
    enum:
      - 'cards'
      - 'rows'

  # ============================================================================
  # 6. ACCESSIBILITÉ & RGAA 4.1.2
  # ============================================================================
  commune.rgaa_titre:
    label: 'Intitulé de la mention d''accessibilité'
    description: 'Texte d''introduction (Ex : Accessibilité : ou Conformité RGAA :)'
    category: commune_a11y
    type: string
    default: 'Accessibilité :'

  commune.rgaa_statut:
    label: 'Statut de conformité légale'
    description: 'Mention obligatoire selon le décret n° 2019-768'
    category: commune_a11y
    type: string
    default: 'partiellement conforme'

  commune.rgaa_taux:
    label: 'Taux de conformité RGAA'
    description: 'Pourcentage résultant de l''audit (Ex : 84%)'
    category: commune_a11y
    type: string
    default: '84%'

  commune.rgaa_page_uid:
    label: 'Page de la Déclaration d''accessibilité (ID / UID)'
    description: 'Identifiant (UID) de la page contenant la déclaration complète (Ex : 96)'
    category: commune_a11y
    type: int
    default: 96

  # ============================================================================
  # 6. PIED DE PAGE : TITRES DES COLONNES
  # ============================================================================
  commune.footer_col1_title:
    label: 'Titre Colonne 1 (Coordonnées & Horaires)'
    category: commune_footer_titles
    type: string
    default: 'Coordonnées & Horaires'

  commune.footer_col2_title:
    label: 'Titre Colonne 2 (Numéros d''urgence)'
    category: commune_footer_titles
    type: string
    default: 'Numéros d''urgence'

  commune.footer_col3_title:
    label: 'Titre Colonne 3 (Nous situer)'
    category: commune_footer_titles
    type: string
    default: 'Nous situer'

  # ============================================================================
  # 6. PIED DE PAGE : BOUTON CONTACT
  # ============================================================================
  commune.footer_contact_btn_title:
    label: 'Texte du bouton de contact'
    description: 'Texte du bouton affiché sous les horaires (Ex : Contacter la mairie)'
    category: commune_footer_contact
    type: string
    default: 'Contacter la mairie'

  commune.footer_contact_page_uid:
    label: 'Page de Contact (ID / UID)'
    description: 'Identifiant de la page vers laquelle pointe le bouton contact du footer (Ex : 22 pour [22] Nous contacter)'
    category: commune_footer_contact
    type: int
    default: 22

  # ============================================================================
  # 6. PIED DE PAGE : PLAN D'ACCÈS / CARTE
  # ============================================================================
  commune.footer_map_image:
    label: 'Image du plan d''accès'
    description: 'Chemin vers l''image ou plan affiché dans le footer (Ex : EXT:site_commune_rgaa/Resources/Public/Images/plan-acces.svg)'
    category: commune_footer_map
    type: string
    default: 'EXT:site_commune_rgaa/Resources/Public/Images/plan-acces.svg'

  commune.footer_map_page_uid:
    label: 'Page du Plan d''accès / Localisation (ID / UID)'
    description: 'Identifiant (UID) de la page ouverte au clic sur l''image du pied de page (Ex : 21 pour [21] Plan d''accès)'
    category: commune_footer_map
    type: int
    default: 21

  # ============================================================================
  # 6. PIED DE PAGE : DOSSIER DES LIENS
  # ============================================================================
  commune.footer_folder_uid:
    label: 'Dossier des liens de bas de page (ID / UID)'
    description: 'Identifiant du dossier contenant les pages du pied de page (Ex : 13 pour le dossier [13] Pied de page)'
    category: commune_footer_links
    type: int
    default: 13

  # ============================================================================
  # 7. APPLICATION MOBILE (PWA) & ALERTES
  # ============================================================================
  commune.pwa_enable:
    label: 'Activer la compatibilité Application Mobile (PWA Android & iOS)'
    description: 'Permet aux citoyens d''installer le site comme une application sur leur écran d''accueil'
    category: commune_app
    type: bool
    default: true

  commune.pwa_app_name:
    label: 'Nom court de l''application mobile'
    description: 'Nom affiché sous l''icône sur l''écran d''accueil du smartphone'
    category: commune_app
    type: string
    default: 'Mairie'

  commune.pwa_vapid_public_key:
    label: 'Clef VAPID Publique (Web Push)'
    description: 'Clef publique pour l''abonnement aux notifications push dans les navigateurs'
    category: commune_app
    type: string
    default: 'BEl62iUYgUivxIkv69yViEuiBIj7EBA70z7_D7j5n_sW4K0r6-0f8K9vP5w0H1X4G5A4L2d6n9Y2K7j0_N2O9I8'

  commune.pwa_vapid_private_key:
    label: 'Clef VAPID Privée (Web Push)'
    description: 'Clef privée utilisée par le serveur pour signer les notifications push'
    category: commune_app
    type: string
    default: 'priv_default_site_commune_rgaa_key'

  commune.pwa_vapid_email:
    label: 'Adresse e-mail de contact VAPID'
    description: 'E-mail envoyé aux serveurs de push (Google/Apple) en tant que sujet de contact'
    category: commune_app
    type: string
    default: 'contact@notre-commune.fr'


  # ============================================================================
  # 8. NUMÉROS D'URGENCE RÉPUBLICAINS
  # ============================================================================
  commune.samu:
    label: 'SAMU (Urgences médicales)'
    category: commune_emergency
    type: string
    default: '15'

  commune.police:
    label: 'Police secours / Gendarmerie'
    category: commune_emergency
    type: string
    default: '17'

  commune.pompiers:
    label: 'Sapeurs-Pompiers'
    category: commune_emergency
    type: string
    default: '18'

  commune.urgence_europeenne:
    label: 'Numéro d''urgence européen'
    category: commune_emergency
    type: string
    default: '112'

  commune.sourds_malentendants:
    label: 'Urgence personnes sourdes et malentendantes (SMS/Visio)'
    category: commune_emergency
    type: string
    default: '114'

  # ============================================================================
  # 9. RÉSEAUX SOCIAUX INSTITUTIONNELS
  # ============================================================================
  commune.social_facebook:
    label: 'Lien Facebook'
    description: 'URL de la page Facebook officielle (Ex : https://facebook.com/Mairie)'
    category: commune_social
    type: string
    default: ''

  commune.social_instagram:
    label: 'Lien Instagram'
    description: 'URL du compte Instagram officiel (Ex : https://instagram.com/Mairie)'
    category: commune_social
    type: string
    default: ''

  commune.social_twitter:
    label: 'Lien Twitter / X'
    description: 'URL du compte Twitter / X officiel (Ex : https://x.com/Mairie)'
    category: commune_social
    type: string
    default: ''

  commune.social_youtube:
    label: 'Lien YouTube'
    description: 'URL de la chaîne YouTube officielle (Ex : https://youtube.com/@Mairie)'
    category: commune_social
    type: string
    default: ''

  commune.header_social_enable:
    label: 'Afficher les réseaux sociaux dans l''en-tête'
    description: 'Affiche les icônes de réseaux sociaux entre le logo et le moteur de recherche'
    category: commune_social
    type: bool
    default: true

  commune.footer_social_enable:
    label: 'Afficher les réseaux sociaux dans le pied de page'
    description: 'Affiche les icônes de réseaux sociaux sous le plan de localisation'
    category: commune_social
    type: bool
    default: true

  # ============================================================================
  # 10. SÉLECTEUR DE LANGUES & MULTILINGUISME
  # ============================================================================
  commune.header_language_enable:
    label: 'Afficher le sélecteur de langues dans l''en-tête'
    description: 'Affiche les icônes de drapeaux pour le changement de langue dans l''en-tête'
    category: commune_language
    type: bool
    default: false

  commune.header_language_position:
    label: 'Emplacement du sélecteur de langues'
    description: 'Sélectionnez où afficher les drapeaux (brand : à côté du logo/marque, center : au centre avec les réseaux sociaux, menu : dans la barre de navigation)'
    category: commune_language
    type: string
    default: 'brand'
    enum:
      - 'brand'
      - 'center'
      - 'menu'



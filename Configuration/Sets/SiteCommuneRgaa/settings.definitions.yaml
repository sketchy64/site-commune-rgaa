categories:
  commune_theme:
    label: 'Apparence & Thèmes Graphiques'
    description: 'Sélection de la charte graphique et des feuilles de styles du site'
  commune_general:
    label: 'Collectivité - Informations Générales'
    description: 'Identité officielle, logo, dénomination et armoiries de la mairie'
  commune_contact:
    label: 'Collectivité - Coordonnées & Horaires'
    description: 'Adresse, téléphone, courriel et horaires d''ouverture au public'
  commune_home_sections:
    label: 'Page d''accueil - Titres des zones'
    description: 'Personnalisation et masquage des titres des sections de la page d''accueil'
  commune_a11y:
    label: 'Accessibilité Numérique & RGAA'
    description: 'Statut de conformité légale RGAA 4.1.2 et déclaration obligatoire'
  commune_footer:
    label: 'Pied de page & Navigation'
    description: 'Configuration des titres de colonnes, du bouton contact, de l''image du plan d''accès et du menu'
  commune_app:
    label: 'Application Mobile (PWA) & Notifications'
    description: 'Installation sur smartphones (iOS / Android) et alertes d''actualités'
  commune_emergency:
    label: 'Numéros d''urgence & Utiles'
    description: 'Numéros d''urgence républicains affichés dans le pied de page'

settings:
  # ============================================================================
  # SÉLECTION DU THÈME GRAPHIQUE
  # ============================================================================
  commune.theme_css:
    label: 'Thème graphique du site'
    description: 'Sélectionnez la charte graphique à appliquer. Par défaut : Thème 1 - Sauveterre (Vert & Or). Choisissez vide pour Bootstrap Package standard.'
    category: commune_theme
    type: string
    default: 'EXT:site_commune_rgaa/Resources/Public/Css/commune-theme-1.css'
    enum:
      - 'EXT:site_commune_rgaa/Resources/Public/Css/commune-theme-1.css'
      - ''

  # ============================================================================
  # INFORMATIONS GÉNÉRALES & LOGO
  # ============================================================================
  commune.logo_file:
    label: 'Chemin du logo de la mairie'
    description: 'Fichier image du logo (Ex : fileadmin/logo.svg ou EXT:site_commune_rgaa/Resources/Public/Images/logo.svg)'
    category: commune_general
    type: string
    default: ''

  commune.logo_height:
    label: 'Hauteur du logo (en pixels)'
    description: 'Hauteur d''affichage du logo dans l''en-tête (Ex : 60)'
    category: commune_general
    type: int
    default: 60

  commune.nom:
    label: 'Nom officiel de la commune / collectivité'
    description: 'Affiché dans l''en-tête, le titre du site et le pied de page'
    category: commune_general
    type: string
    default: 'Mairie de Notre-Commune'

  commune.header_hide_title:
    label: 'Masquer le nom de la commune dans l''en-tête'
    description: 'Cocher pour masquer le texte du titre si le logo contient déjà le nom'
    category: commune_general
    type: bool
    default: false

  commune.slogan:
    label: 'Devise ou sous-titre officiel'
    description: 'Exemple : République Française - Liberté, Égalité, Fraternité'
    category: commune_general
    type: string
    default: 'République Française - Liberté, Égalité, Fraternité'

  commune.header_hide_slogan:
    label: 'Masquer le slogan/devise dans l''en-tête'
    category: commune_general
    type: bool
    default: false

  commune.departement:
    label: 'Département'
    description: 'Exemple : 64 - Pyrénées-Atlantiques'
    category: commune_general
    type: string
    default: '64 - Pyrénées-Atlantiques'

  commune.region:
    label: 'Région'
    description: 'Exemple : Nouvelle-Aquitaine'
    category: commune_general
    type: string
    default: 'Nouvelle-Aquitaine'

  # ============================================================================
  # COORDONNÉES & HORAIRES
  # ============================================================================
  commune.adresse:
    label: 'Adresse postale de la Mairie'
    description: 'Numéro, rue, code postal et ville'
    category: commune_contact
    type: string
    default: '1 Place de la République, 64000 Commune'

  commune.telephone:
    label: 'Numéro de téléphone officiel'
    description: 'Exemple : 05 59 00 00 00'
    category: commune_contact
    type: string
    default: '05 59 00 00 00'

  commune.email:
    label: 'Adresse e-mail de contact'
    description: 'Exemple : contact@notre-commune.fr'
    category: commune_contact
    type: string
    default: 'contact@notre-commune.fr'

  commune.horaires:
    label: 'Horaires d''ouverture au public'
    description: 'Horaires d''accueil de la mairie pour les administrés'
    category: commune_contact
    type: string
    default: 'Du Lundi au Vendredi : 8h30 - 12h00 / 13h30 - 17h30'

  # ============================================================================
  # PAGE D'ACCUEIL - TITRES & VISIBILITÉ DES ZONES
  # ============================================================================
  commune.home_quickaccess_title:
    label: 'Titre de la zone Accès rapides'
    description: 'Titre au-dessus des icônes ou démarches'
    category: commune_home_sections
    type: string
    default: 'Accès rapides'

  commune.home_quickaccess_hide_title:
    label: 'Masquer le titre de la zone Accès rapides'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_edito_title:
    label: 'Titre de la zone Édito'
    description: 'Titre de la section Mot du Maire / Édito'
    category: commune_home_sections
    type: string
    default: 'Le mot du Maire'

  commune.home_edito_hide_title:
    label: 'Masquer le titre de la zone Édito'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_news_title:
    label: 'Titre de la zone Actualités & Agenda'
    description: 'Titre de la section des actualités et événements municipaux'
    category: commune_home_sections
    type: string
    default: 'Actualités & Agenda municipal'

  commune.home_news_hide_title:
    label: 'Masquer le titre de la zone Actualités & Agenda'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_map_title:
    label: 'Titre de la zone Carte interactive'
    description: 'Titre de la section de découverte et plan interactif'
    category: commune_home_sections
    type: string
    default: 'Plan interactif & Découverte'

  commune.home_map_hide_title:
    label: 'Masquer le titre de la zone Carte interactive'
    category: commune_home_sections
    type: bool
    default: false

  commune.home_sitemap_enable:
    label: 'Activer la section Plan du site sur la page d''accueil'
    description: 'Affiche la section du plan du site avant le pied de page'
    category: commune_home_sections
    type: bool
    default: true

  commune.home_sitemap_title:
    label: 'Titre de la section Plan du site'
    description: 'Titre de la section du plan du site'
    category: commune_home_sections
    type: string
    default: 'Plan du site & Navigation'

  commune.home_sitemap_hide_title:
    label: 'Masquer le titre de la section Plan du site'
    category: commune_home_sections
    type: bool
    default: false

  # ============================================================================
  # ACCESSIBILITÉ & RGAA 4.1.2
  # ============================================================================
  commune.rgaa_titre:
    label: 'Intitulé de la mention d''accessibilité'
    description: 'Texte d''introduction (Ex : Accessibilité : ou Conformité RGAA :)'
    category: commune_a11y
    type: string
    default: 'Accessibilité :'

  commune.rgaa_statut:
    label: 'Statut de conformité légale'
    description: 'Mention obligatoire selon le décret n° 2019-768'
    category: commune_a11y
    type: string
    default: 'partiellement conforme'

  commune.rgaa_taux:
    label: 'Taux de conformité RGAA'
    description: 'Pourcentage résultant de l''audit (Ex : 84%)'
    category: commune_a11y
    type: string
    default: '84%'

  commune.rgaa_page_uid:
    label: 'Page de la Déclaration d''accessibilité (ID / UID)'
    description: 'Identifiant (UID) de la page contenant la déclaration complète (Ex : 96)'
    category: commune_a11y
    type: int
    default: 96

  # ============================================================================
  # PIED DE PAGE & NAVIGATION
  # ============================================================================
  commune.footer_col1_title:
    label: 'Titre Colonne 1 du Pied de page'
    category: commune_footer
    type: string
    default: 'Coordonnées & Horaires'

  commune.footer_contact_btn_title:
    label: 'Texte du bouton de contact (Pied de page)'
    description: 'Texte du bouton affiché sous les horaires (Ex : Contacter la mairie)'
    category: commune_footer
    type: string
    default: 'Contacter la mairie'

  commune.footer_contact_page_uid:
    label: 'Page de Contact (ID / UID)'
    description: 'Identifiant de la page vers laquelle pointe le bouton contact du footer (Ex : 22 pour [22] Nous contacter)'
    category: commune_footer
    type: int
    default: 22

  commune.footer_col2_title:
    label: 'Titre Colonne 2 du Pied de page'
    category: commune_footer
    type: string
    default: 'Numéros d''urgence'

  commune.footer_col3_title:
    label: 'Titre Colonne 3 du Pied de page (Nous situer)'
    category: commune_footer
    type: string
    default: 'Nous situer'

  commune.footer_map_image:
    label: 'Image du plan d''accès (Pied de page)'
    description: 'Chemin vers l''image ou plan affiché dans le footer (Ex : EXT:site_commune_rgaa/Resources/Public/Images/plan-acces.svg)'
    category: commune_footer
    type: string
    default: 'EXT:site_commune_rgaa/Resources/Public/Images/plan-acces.svg'

  commune.footer_map_page_uid:
    label: 'Page du Plan d''accès / Localisation (ID / UID)'
    description: 'Identifiant (UID) de la page ouverte au clic sur l''image du pied de page (Ex : 21 pour [21] Plan d''accès)'
    category: commune_footer
    type: int
    default: 21

  commune.footer_folder_uid:
    label: 'Dossier des liens de bas de page (ID / UID)'
    description: 'Identifiant du dossier contenant les pages du pied de page (Ex : 13 pour le dossier [13] Pied de page)'
    category: commune_footer
    type: int
    default: 13

  # ============================================================================
  # APPLICATION MOBILE (PWA) & NOTIFICATIONS
  # ============================================================================
  commune.pwa_enable:
    label: 'Activer la compatibilité Application Mobile (PWA Android & iOS)'
    description: 'Permet aux citoyens d''installer le site comme une application sur leur écran d''accueil'
    category: commune_app
    type: bool
    default: true

  commune.pwa_app_name:
    label: 'Nom court de l''application mobile'
    description: 'Nom affiché sous l''icône sur l''écran d''accueil du smartphone'
    category: commune_app
    type: string
    default: 'Mairie'

  # ============================================================================
  # NUMÉROS D'URGENCE RÉPUBLICAINS
  # ============================================================================
  commune.samu:
    label: 'SAMU (Urgences médicales)'
    category: commune_emergency
    type: string
    default: '15'

  commune.police:
    label: 'Police secours / Gendarmerie'
    category: commune_emergency
    type: string
    default: '17'

  commune.pompiers:
    label: 'Sapeurs-Pompiers'
    category: commune_emergency
    type: string
    default: '18'

  commune.urgence_europeenne:
    label: 'Numéro d''urgence européen'
    category: commune_emergency
    type: string
    default: '112'

  commune.sourds_malentendants:
    label: 'Urgence personnes sourdes et malentendantes (SMS/Visio)'
    category: commune_emergency
    type: string
    default: '114'

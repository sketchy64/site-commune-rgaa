<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!-- Bandeau d'en-tête des pages de contenu : Hero - Titre - Fil d'Ariane (RGAA 4.1 Critères 9.1 & 12.10) -->
<header class="commune-page-hero bg-light border-bottom py-4 mb-4 position-relative overflow-hidden {f:if(condition: pageMedia.0, then: 'commune-page-hero-with-media')}">
    <f:if condition="{pageMedia.0}">
        <div class="commune-page-hero-media position-absolute top-0 start-0 w-100 h-100" aria-hidden="true">
            <f:image image="{pageMedia.0}" class="w-100 h-100 object-fit-cover opacity-25" alt="" />
        </div>
    </f:if>

    <div class="container position-relative">
        <!-- Fil d'Ariane accessible (Critère 12.10) -->
        <f:if condition="{rootLine -> f:count()} > 1">
            <nav aria-label="{f:translate(key: 'nav.breadcrumb', extensionName: 'site_commune_rgaa')}" class="commune-hero-breadcrumb mb-3">
                <ol class="breadcrumb mb-0 small" itemscope itemtype="https://schema.org/BreadcrumbList">
                    <f:for each="{rootLine}" as="pageItem" iteration="iter">
                        <f:if condition="{pageItem.doktype} != 254">
                            <li class="breadcrumb-item {f:if(condition: iter.isLast, then: 'active')}" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                                <f:if condition="{iter.isLast}">
                                    <f:then>
                                        <span itemprop="name" aria-current="page">{pageItem.title}</span>
                                        <meta itemprop="position" content="{iter.cycle}" />
                                    </f:then>
                                    <f:else>
                                        <f:link.page pageUid="{pageItem.uid}" additionalAttributes="{itemprop: 'item'}">
                                            <span itemprop="name">{pageItem.title}</span>
                                        </f:link.page>
                                        <meta itemprop="position" content="{iter.cycle}" />
                                    </f:else>
                                </f:if>
                            </li>
                        </f:if>
                    </f:for>
                </ol>
            </nav>
        </f:if>

        <!-- Titre H1 unique de la page (Critère 9.1) -->
        <div class="commune-page-hero-heading">
            <h1 class="page-title commune-section-title mb-0">{data.title}</h1>
            <f:if condition="{data.subtitle}">
                <p class="lead text-muted mt-3 mb-0">{data.subtitle}</p>
            </f:if>
        </div>
    </div>
</header>
</html>

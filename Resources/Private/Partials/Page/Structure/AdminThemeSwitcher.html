<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!-- Panneau de sélection du Thème et des Couleurs en direct (Live Preview Frontend) -->
<aside id="commune-admin-switcher" class="commune-admin-switcher" role="region" aria-label="Testeur de Thèmes et Couleurs en direct" data-server-theme="{activeTheme}" data-server-color="{activeColorScheme}">
    <!-- Bouton Toggle / Badge -->
    <button type="button" id="admin-switcher-toggle" class="admin-switcher-toggle" aria-expanded="false" aria-controls="admin-switcher-panel" title="Ouvrir le testeur de thèmes et couleurs en direct">
        <span class="admin-switcher-icon" aria-hidden="true">🎨</span>
        <span class="admin-switcher-label">Thème & Couleurs</span>
        <span id="admin-switcher-indicator" class="admin-switcher-badge d-none" title="Aperçu local actif (temporaire)">Custom</span>
    </button>

    <!-- Contenu du Panneau -->
    <div id="admin-switcher-panel" class="admin-switcher-panel d-none" aria-hidden="true">
        <div class="admin-switcher-header">
            <h3 class="admin-switcher-title">🎨 Personnalisation en direct</h3>
            <button type="button" id="admin-switcher-close" class="admin-switcher-close" aria-label="Fermer le panneau de personnalisation">✕</button>
        </div>
        
        <div class="admin-switcher-body">
            <!-- Choix du Thème CSS (Structure & Formes) -->
            <div class="admin-switcher-field">
                <label for="admin-theme-select" class="admin-switcher-field-label">Style de Thème :</label>
                <select id="admin-theme-select" class="form-select form-select-sm" aria-label="Style de Thème">
                    <option value="{f:uri.resource(extensionName: 'SiteCommuneRgaa', path: 'Css/commune-theme-1.css')}" data-key="commune-theme-1.css">Thème 1 (Classique : Arrondis, Ombres & Dégradés)</option>
                    <option value="{f:uri.resource(extensionName: 'SiteCommuneRgaa', path: 'Css/commune-theme-2.css')}" data-key="commune-theme-2.css">Thème 2 (Moderne : Angles Droits, Lignes Nettes & Blocs)</option>
                    <option value="none" data-key="none">Bootstrap Package Standard (Sans surcouche)</option>
                </select>
            </div>

            <!-- Choix de la Palette de Couleurs CSS -->
            <div class="admin-switcher-field">
                <label for="admin-color-select" class="admin-switcher-field-label">Jeu de Couleurs :</label>
                <select id="admin-color-select" class="form-select form-select-sm" aria-label="Jeu de Couleurs">
                    <option value="{f:uri.resource(extensionName: 'SiteCommuneRgaa', path: 'Css/commune-couleurs-1.css')}" data-key="commune-couleurs-1.css">Jeu 1 (Vert Institutionnel & Or)</option>
                    <option value="{f:uri.resource(extensionName: 'SiteCommuneRgaa', path: 'Css/commune-couleurs-2.css')}" data-key="commune-couleurs-2.css">Jeu 2 (Bleu Océan & Sable)</option>
                    <option value="{f:uri.resource(extensionName: 'SiteCommuneRgaa', path: 'Css/commune-couleurs-3.css')}" data-key="commune-couleurs-3.css">Jeu 3 (Ardoise Montagne & Terracotta)</option>
                </select>
            </div>

            <!-- Bouton de réinitialisation -->
            <div class="admin-switcher-actions">
                <button type="button" id="admin-switcher-reset" class="btn btn-sm btn-outline-danger w-100" title="Effacer l'aperçu local et recharger avec la configuration officielle du serveur">
                    🔄 Réinitialiser aux paramètres serveur
                </button>
            </div>
        </div>
    </div>
</aside>

<!-- JavaScript interactif pour le sélecteur -->
<script>
(function() {
    function initThemeSwitcher() {
        var toggleBtn = document.getElementById('admin-switcher-toggle');
        var closeBtn = document.getElementById('admin-switcher-close');
        var panel = document.getElementById('admin-switcher-panel');
        var themeSelect = document.getElementById('admin-theme-select');
        var colorSelect = document.getElementById('admin-color-select');
        var resetBtn = document.getElementById('admin-switcher-reset');
        var indicator = document.getElementById('admin-switcher-indicator');
        var switcherEl = document.getElementById('commune-admin-switcher');

        if (!toggleBtn || !panel || !themeSelect || !colorSelect) return;

        // Synchronisation automatique avec la configuration serveur :
        // Si les réglages serveur ont changé dans le back-office, on purge le stockage temporaire local
        var serverTheme = switcherEl ? (switcherEl.getAttribute('data-server-theme') || '') : '';
        var serverColor = switcherEl ? (switcherEl.getAttribute('data-server-color') || '') : '';
        var lastServerTheme = localStorage.getItem('commune_last_server_theme');
        var lastServerColor = localStorage.getItem('commune_last_server_color');

        if (lastServerTheme !== null && (lastServerTheme !== serverTheme || lastServerColor !== serverColor)) {
            localStorage.removeItem('commune_theme');
            localStorage.removeItem('commune_color');
        }
        localStorage.setItem('commune_last_server_theme', serverTheme);
        localStorage.setItem('commune_last_server_color', serverColor);

        function findOrCreateLink(id, pattern) {
            var el = document.getElementById(id);
            if (el) return el;
            var links = document.querySelectorAll('link[rel="stylesheet"]');
            for (var i = 0; i < links.length; i++) {
                if (links[i].href && pattern.test(links[i].href)) {
                    links[i].id = id;
                    return links[i];
                }
            }
            return null;
        }

        function updateIndicator() {
            var hasCustom = !!(localStorage.getItem('commune_theme') || localStorage.getItem('commune_color'));
            if (indicator) {
                if (hasCustom) {
                    indicator.classList.remove('d-none');
                } else {
                    indicator.classList.add('d-none');
                }
            }
        }

        function applyStyle(type, targetUrl, targetKey, save) {
            var isColor = (type === 'color');
            var linkId = isColor ? 'commune-color-scheme-link' : 'commune-theme-link';
            var pattern = isColor ? /commune-couleurs/ : /commune-theme/;
            var storageKey = isColor ? 'commune_color' : 'commune_theme';

            var currentLink = findOrCreateLink(linkId, pattern);

            if (targetUrl === 'none') {
                if (currentLink && currentLink.parentNode) {
                    currentLink.parentNode.removeChild(currentLink);
                }
                if (save) localStorage.setItem(storageKey, 'none');
                updateIndicator();
                return;
            }

            // Création d'un nouvel élément pour recalculer immédiatement les styles sans délai
            var newLink = document.createElement('link');
            newLink.rel = 'stylesheet';
            newLink.id = linkId;
            newLink.href = targetUrl;

            newLink.onload = function() {
                if (currentLink && currentLink !== newLink && currentLink.parentNode) {
                    currentLink.parentNode.removeChild(currentLink);
                }
            };

            if (currentLink && currentLink.parentNode) {
                currentLink.parentNode.insertBefore(newLink, currentLink.nextSibling);
            } else {
                document.head.appendChild(newLink);
            }

            if (save && targetKey) {
                localStorage.setItem(storageKey, targetKey);
            }
            updateIndicator();
        }

        // Synchroniser le select de couleur avec la page actuelle
        var colorLink = findOrCreateLink('commune-color-scheme-link', /commune-couleurs/);
        var savedColor = localStorage.getItem('commune_color');

        if (savedColor) {
            for (var c = 0; c < colorSelect.options.length; c++) {
                if (colorSelect.options[c].getAttribute('data-key') === savedColor) {
                    colorSelect.selectedIndex = c;
                    applyStyle('color', colorSelect.options[c].value, savedColor, false);
                    break;
                }
            }
        } else if (colorLink && colorLink.href) {
            for (var c = 0; c < colorSelect.options.length; c++) {
                var key = colorSelect.options[c].getAttribute('data-key');
                if (key && colorLink.href.indexOf(key) !== -1) {
                    colorSelect.selectedIndex = c;
                    break;
                }
            }
        }

        // Synchroniser le select de thème avec la page actuelle
        var themeLink = findOrCreateLink('commune-theme-link', /commune-theme/);
        var savedTheme = localStorage.getItem('commune_theme');

        if (savedTheme) {
            for (var t = 0; t < themeSelect.options.length; t++) {
                if (themeSelect.options[t].getAttribute('data-key') === savedTheme) {
                    themeSelect.selectedIndex = t;
                    applyStyle('theme', themeSelect.options[t].value, savedTheme, false);
                    break;
                }
            }
        } else if (themeLink && themeLink.href) {
            for (var t = 0; t < themeSelect.options.length; t++) {
                var tKey = themeSelect.options[t].getAttribute('data-key');
                if (tKey && themeLink.href.indexOf(tKey) !== -1) {
                    themeSelect.selectedIndex = t;
                    break;
                }
            }
        } else if (!themeLink) {
            themeSelect.value = 'none';
        }

        updateIndicator();

        // Événements d'ouverture/fermeture du panneau
        toggleBtn.addEventListener('click', function() {
            var isExpanded = toggleBtn.getAttribute('aria-expanded') === 'true';
            toggleBtn.setAttribute('aria-expanded', !isExpanded);
            if (isExpanded) {
                panel.classList.add('d-none');
                panel.setAttribute('aria-hidden', 'true');
            } else {
                panel.classList.remove('d-none');
                panel.setAttribute('aria-hidden', 'false');
            }
        });

        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                toggleBtn.setAttribute('aria-expanded', 'false');
                panel.classList.add('d-none');
                panel.setAttribute('aria-hidden', 'true');
            });
        }

        // Événements de sélection en direct
        themeSelect.addEventListener('change', function() {
            var selectedOpt = this.options[this.selectedIndex];
            var key = selectedOpt.getAttribute('data-key') || this.value;
            applyStyle('theme', this.value, key, true);
        });

        colorSelect.addEventListener('change', function() {
            var selectedOpt = this.options[this.selectedIndex];
            var key = selectedOpt.getAttribute('data-key') || this.value;
            applyStyle('color', this.value, key, true);
        });

        // Bouton réinitialiser
        if (resetBtn) {
            resetBtn.addEventListener('click', function() {
                localStorage.removeItem('commune_theme');
                localStorage.removeItem('commune_color');
                localStorage.removeItem('commune_last_server_theme');
                localStorage.removeItem('commune_last_server_color');
                window.location.reload();
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initThemeSwitcher);
    } else {
        initThemeSwitcher();
    }
})();
</script>

<style>
.commune-admin-switcher {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 10000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.admin-switcher-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0f172a;
    color: #ffffff;
    border: 2px solid #38bdf8;
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, background 0.15s ease;
}
.admin-switcher-toggle:hover,
.admin-switcher-toggle:focus {
    background: #1e293b;
    transform: translateY(-2px);
    outline: 3px solid #38bdf8;
}
.admin-switcher-badge {
    background: #eab308;
    color: #0f172a;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    text-transform: uppercase;
    font-weight: 800;
}
.admin-switcher-panel {
    position: absolute;
    bottom: 50px;
    left: 0;
    width: 320px;
    background: #ffffff;
    border: 2px solid #0f172a;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow: hidden;
    animation: adminPanelSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes adminPanelSlide {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.admin-switcher-header {
    background: #0f172a;
    color: #ffffff;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.admin-switcher-title {
    font-size: 13px;
    font-weight: 700;
    margin: 0;
    color: #ffffff !important;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.admin-switcher-close {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
}
.admin-switcher-close:hover {
    color: #ffffff;
}
.admin-switcher-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.admin-switcher-field-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    margin-bottom: 4px;
}
.admin-switcher-actions {
    margin-top: 4px;
}
</style>
</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!-- Bandeau Supérieur d'information PWA & Notifications Push -->
<f:if condition="{communePwaTopBannerEnable} != '0'">
    <aside id="pwa-top-banner" class="pwa-top-banner bg-dark text-white py-2 border-bottom shadow-sm" role="region" aria-label="Application mobile et notifications citoyennes">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
            <!-- Message explicatif citoyen -->
            <div class="d-flex align-items-center gap-2 small flex-grow-1">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0 text-warning" aria-hidden="true">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                    <line x1="12" y1="18" x2="12.01" y2="18"/>
                </svg>
                <div class="lh-sm">
                    <strong>Application & Alertes :</strong> Installez le site de 
                    <f:if condition="{communeNom}">
                        <f:then><strong>{communeNom}</strong></f:then>
                        <f:else>la mairie</f:else>
                    </f:if>
                    sur votre écran d'accueil (via le bouton ci-contre ou le menu de votre navigateur : <em>3 petits points &#8942; &gt; Installer l'application</em>) pour recevoir les actualités en direct.
                </div>
            </div>

            <!-- Boutons d'action : Installer & Notifications -->
            <div class="d-flex align-items-center gap-2 ms-auto">
                <!-- Bouton 1 : Installer l'application PWA -->
                <button type="button" id="pwa-install-btn-banner" class="btn btn-sm btn-light pwa-install-trigger d-none align-items-center gap-1 shadow-sm fw-semibold" aria-label="Installer l'application sur votre smartphone">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Installer l'App</span>
                </button>

                <!-- Bouton 2 : Activation/Désactivation des notifications Push -->
                <button type="button" id="pwa-notify-btn-banner" class="btn btn-sm btn-warning pwa-notify-trigger d-inline-flex align-items-center gap-1 shadow-sm fw-semibold" aria-label="Activer les notifications push d'actualités">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Activer les notifications</span>
                </button>

                <!-- Bouton de fermeture du bandeau -->
                <button type="button" id="pwa-banner-close-btn" class="btn-close btn-close-white ms-2" aria-label="Fermer le bandeau d'information PWA"></button>
            </div>
        </div>
    </aside>
</f:if>
</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!-- Bandeau Supérieur d'information PWA & Notifications Push (Compact et haute lisibilité) -->
<f:if condition="{communePwaTopBannerEnable} != '0'">
    <aside id="pwa-top-banner" class="pwa-top-banner bg-dark text-white py-1 border-bottom shadow-sm" style="font-size: 0.8125rem; min-height: 34px;" role="region" aria-label="Application mobile et notifications citoyennes">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2 py-0 pwa-top-banner-container">
            <!-- Message explicatif citoyen personnalisable via la constante commune.pwa_top_banner_text -->
            <div class="d-flex align-items-center gap-2 flex-grow-1 text-truncate pwa-banner-message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffc107" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0 text-warning" aria-hidden="true">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                    <line x1="12" y1="18" x2="12.01" y2="18"/>
                </svg>
                <span class="text-truncate">
                    <f:if condition="{communePwaTopBannerText}">
                        <f:then>{communePwaTopBannerText}</f:then>
                        <f:else>Installez l'application Mairie et recevez les alertes en direct sur votre écran.</f:else>
                    </f:if>
                </span>
            </div>

            <!-- Boutons d'action : Installer & Notifications -->
            <div class="d-flex align-items-center gap-2 ms-auto flex-shrink-0 pwa-banner-actions">
                <!-- Bouton 1 : Installer l'application PWA (Texte et Icône foncés sur fond blanc pour contraste optimal) -->
                <button type="button" id="pwa-install-btn-banner" class="btn btn-sm btn-light text-dark fw-bold border py-0 px-2 pwa-install-trigger d-none align-items-center gap-1 shadow-sm" style="font-size: 0.775rem; height: 26px;" aria-label="Installer l'application sur votre smartphone">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#212529" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span class="text-dark fw-bold">Installer l'App</span>
                </button>

                <!-- Bouton 2 : Activation/Désactivation des notifications Push (Haute lisibilité avec icône et texte foncés sur fond jaune) -->
                <button type="button" id="pwa-notify-btn-banner" class="btn btn-sm btn-warning text-dark fw-bold py-0 px-2 pwa-notify-trigger d-inline-flex align-items-center gap-1 shadow-sm" style="font-size: 0.775rem; height: 26px;" aria-label="Activer les notifications push d'actualités">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#212529" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="stroke: #212529 !important; fill: none !important; color: #212529 !important;" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="text-dark fw-bold">Activer les notifications</span>
                </button>

                <!-- Bouton de fermeture du bandeau (Affiché uniquement si communePwaTopBannerShowClose != 0) -->
                <f:if condition="{communePwaTopBannerShowClose} != '0'">
                    <button type="button" id="pwa-banner-close-btn" class="btn-close btn-close-white p-0 ms-1" style="font-size: 0.65rem;" aria-label="Fermer le bandeau d'information PWA"></button>
                </f:if>
            </div>
        </div>
    </aside>
</f:if>
</html>

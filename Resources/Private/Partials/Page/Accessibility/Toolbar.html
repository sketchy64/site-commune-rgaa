<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!-- Barre d'outils d'accessibilité (Toolbar A11y) -->
<aside class="a11y-toolbar bg-light border-bottom py-1" aria-label="{f:translate(key: 'a11y.toolbar.title', extensionName: 'site_commune_rgaa')}">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2 a11y-toolbar-container">
        <!-- Raccourcis d'urgence et numéro citoyen -->
        <div class="a11y-toolbar-info small text-muted d-none d-md-flex align-items-center gap-3">
            <span class="d-inline-flex align-items-center gap-1">
                <svg class="flex-shrink-0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                {communeNom} ({communeDepartement})
            </span>
            <f:if condition="{communeTelephone}">
                <span class="d-inline-flex align-items-center gap-1">
                    <svg class="flex-shrink-0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                    <a href="tel:{communeTelephone}" class="text-decoration-none text-muted fw-semibold">
                        <span class="visually-hidden">Téléphone de la mairie : </span>{communeTelephone}
                    </a>
                </span>
            </f:if>
        </div>

        <!-- Contrôles ergonomiques d'accessibilité -->
        <div class="a11y-toolbar-controls ms-auto d-flex align-items-center gap-2">
            <!-- Taille de police -->
            <div class="btn-group btn-group-sm" role="group" aria-label="Ajustement de la taille de texte">
                <button type="button" id="a11y-font-decrease" class="btn btn-outline-secondary btn-sm" aria-label="{f:translate(key: 'a11y.font_size.decrease', extensionName: 'site_commune_rgaa')}">
                    <span aria-hidden="true">A-</span>
                </button>
                <button type="button" id="a11y-font-reset" class="btn btn-outline-secondary btn-sm" aria-label="{f:translate(key: 'a11y.font_size.reset', extensionName: 'site_commune_rgaa')}">
                    <span aria-hidden="true">A</span>
                </button>
                <button type="button" id="a11y-font-increase" class="btn btn-outline-secondary btn-sm" aria-label="{f:translate(key: 'a11y.font_size.increase', extensionName: 'site_commune_rgaa')}">
                    <span aria-hidden="true">A+</span>
                </button>
            </div>

            <!-- Mode Contraste Renforcé -->
            <button type="button" id="a11y-toggle-contrast" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" aria-pressed="false" aria-label="{f:translate(key: 'a11y.contrast.toggle', extensionName: 'site_commune_rgaa')}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"></path>
                </svg>
                <span class="d-none d-sm-inline">Contraste</span>
            </button>

            <!-- Mode Police Dyslexie -->
            <button type="button" id="a11y-toggle-dyslexic" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" aria-pressed="false" aria-label="{f:translate(key: 'a11y.dyslexic.toggle', extensionName: 'site_commune_rgaa')}">
                <span aria-hidden="true" class="fw-bold">Dys</span>
                <span class="d-none d-sm-inline">Police Dys</span>
            </button>
        </div>
    </div>
</aside>
</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"

    <div class="container">

        <button class="navbar-toggler d-lg-none my-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMainContent" aria-controls="navbarMainContent" aria-expanded="false" aria-label="Afficher ou masquer le menu de navigation">

                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <span class="navbar-toggler-label">Menu</span>

        <div class="collapse navbar-collapse" id="navbarMainContent">
            <f:format.raw>{mainNavigation}</f:format.raw>
        </div>
    </div>

</html>

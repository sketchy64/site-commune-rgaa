<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:bk2k="http://typo3.org/ns/BK2K/BootstrapPackage/ViewHelpers"
      xmlns:rgaa="http://typo3.org/ns/Commune/SiteCommuneRgaa/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!--
    PARTIAL: EXT:site_commune_rgaa/Resources/Private/Partials/ContentElements/Media/Textmedia.html
    REASON: Conforme RGAA 4.1 / WCAG 2.1 AA pour les éléments texte et médias / texte et images
-->

<div class="commune-textmedia textmedia textmedia-{data.imageorient} clearfix">
    <f:if condition="{gallery.rows}">
        <figure class="figure textmedia-gallery mb-3 {f:if(condition: '{data.imageorient} == 0', then: 'float-none')} {f:if(condition: '{data.imageorient} == 1', then: 'float-md-end ms-md-4')} {f:if(condition: '{data.imageorient} == 2', then: 'float-md-start me-md-4')}">
            <f:for each="{gallery.rows}" as="row">
                <f:for each="{row.columns}" as="column">
                    <f:if condition="{column.media}">
                        <f:if condition="{column.media.alternative}">
                            <f:then>
                                <f:image image="{column.media}"
                                         class="figure-img img-fluid rounded"
                                         title="{column.media.title}"
                                         alt="{column.media.alternative}" />
                            </f:then>
                            <f:else>
                                <f:image image="{column.media}"
                                         class="figure-img img-fluid rounded"
                                         title="{column.media.title}"
                                         alt=""
                                         additionalAttributes="{role: 'presentation', aria-hidden: 'true'}" />
                            </f:else>
                        </f:if>
                        <f:if condition="{column.media.description}">
                            <figcaption class="figure-caption text-muted small mt-1">
                                {column.media.description}
                            </figcaption>
                        </f:if>
                    </f:if>
                </f:for>
            </f:for>
        </figure>
    </f:if>

    <f:if condition="{data.bodytext}">
        <div class="textmedia-body">
            <f:format.html>{data.bodytext}</f:format.html>
        </div>
    </f:if>
</div>
</html>

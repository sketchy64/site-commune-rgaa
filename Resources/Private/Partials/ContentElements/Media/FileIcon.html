<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:switch expression="{extension -> f:format.case(mode: 'lower')}">
    <!-- Fichier PDF -->
    <f:case value="pdf">
        <f:render section="PdfIcon" arguments="{_all}" />
    </f:case>

    <!-- Fichiers Traitement de texte (Word, OpenDocument Text) -->
    <f:case value="doc"><f:render section="WordIcon" arguments="{_all}" /></f:case>
    <f:case value="docx"><f:render section="WordIcon" arguments="{_all}" /></f:case>
    <f:case value="odt"><f:render section="WordIcon" arguments="{_all}" /></f:case>
    <f:case value="rtf"><f:render section="WordIcon" arguments="{_all}" /></f:case>

    <!-- Fichiers Tableur (Excel, OpenDocument Spreadsheet, CSV) -->
    <f:case value="xls"><f:render section="ExcelIcon" arguments="{_all}" /></f:case>
    <f:case value="xlsx"><f:render section="ExcelIcon" arguments="{_all}" /></f:case>
    <f:case value="ods"><f:render section="ExcelIcon" arguments="{_all}" /></f:case>
    <f:case value="csv"><f:render section="ExcelIcon" arguments="{_all}" /></f:case>

    <!-- Fichiers Présentation (PowerPoint, OpenDocument Presentation) -->
    <f:case value="ppt"><f:render section="PowerPointIcon" arguments="{_all}" /></f:case>
    <f:case value="pptx"><f:render section="PowerPointIcon" arguments="{_all}" /></f:case>
    <f:case value="odp"><f:render section="PowerPointIcon" arguments="{_all}" /></f:case>

    <!-- Fichiers Archives compressées (ZIP, RAR, 7Z, TAR, GZ) -->
    <f:case value="zip"><f:render section="ArchiveIcon" arguments="{_all}" /></f:case>
    <f:case value="rar"><f:render section="ArchiveIcon" arguments="{_all}" /></f:case>
    <f:case value="7z"><f:render section="ArchiveIcon" arguments="{_all}" /></f:case>
    <f:case value="tar"><f:render section="ArchiveIcon" arguments="{_all}" /></f:case>
    <f:case value="gz"><f:render section="ArchiveIcon" arguments="{_all}" /></f:case>

    <!-- Fichiers Images (JPG, JPEG, PNG, WEBP, SVG, GIF) -->
    <f:case value="jpg"><f:render section="ImageIcon" arguments="{_all}" /></f:case>
    <f:case value="jpeg"><f:render section="ImageIcon" arguments="{_all}" /></f:case>
    <f:case value="png"><f:render section="ImageIcon" arguments="{_all}" /></f:case>
    <f:case value="webp"><f:render section="ImageIcon" arguments="{_all}" /></f:case>
    <f:case value="svg"><f:render section="ImageIcon" arguments="{_all}" /></f:case>
    <f:case value="gif"><f:render section="ImageIcon" arguments="{_all}" /></f:case>
    <f:case value="tiff"><f:render section="ImageIcon" arguments="{_all}" /></f:case>
    <f:case value="bmp"><f:render section="ImageIcon" arguments="{_all}" /></f:case>

    <!-- Fichiers Audio (MP3, WAV, OGG, M4A, AAC, FLAC) -->
    <f:case value="mp3"><f:render section="AudioIcon" arguments="{_all}" /></f:case>
    <f:case value="wav"><f:render section="AudioIcon" arguments="{_all}" /></f:case>
    <f:case value="ogg"><f:render section="AudioIcon" arguments="{_all}" /></f:case>
    <f:case value="m4a"><f:render section="AudioIcon" arguments="{_all}" /></f:case>
    <f:case value="aac"><f:render section="AudioIcon" arguments="{_all}" /></f:case>
    <f:case value="flac"><f:render section="AudioIcon" arguments="{_all}" /></f:case>

    <!-- Fichiers Vidéo (MP4, WEBM, MKV, MOV, AVI) -->
    <f:case value="mp4"><f:render section="VideoIcon" arguments="{_all}" /></f:case>
    <f:case value="webm"><f:render section="VideoIcon" arguments="{_all}" /></f:case>
    <f:case value="mkv"><f:render section="VideoIcon" arguments="{_all}" /></f:case>
    <f:case value="mov"><f:render section="VideoIcon" arguments="{_all}" /></f:case>
    <f:case value="avi"><f:render section="VideoIcon" arguments="{_all}" /></f:case>

    <!-- Fichiers Texte / Données (TXT, JSON, XML, HTML, MD) -->
    <f:case value="txt"><f:render section="TextIcon" arguments="{_all}" /></f:case>
    <f:case value="json"><f:render section="TextIcon" arguments="{_all}" /></f:case>
    <f:case value="xml"><f:render section="TextIcon" arguments="{_all}" /></f:case>
    <f:case value="html"><f:render section="TextIcon" arguments="{_all}" /></f:case>
    <f:case value="md"><f:render section="TextIcon" arguments="{_all}" /></f:case>

    <!-- Document générique / Défaut -->
    <f:defaultCase>
        <f:render section="GenericIcon" arguments="{_all}" />
    </f:defaultCase>
</f:switch>

<!-- ==============================================================================
     SECTIONS SVG PAR TYPE DE FICHIER
     ============================================================================== -->

<f:section name="PdfIcon">
    <div class="commune-file-icon-badge file-icon-pdf" aria-hidden="true">
        <svg class="commune-file-svg" viewBox="0 0 48 48" width="44" height="44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="10" fill="#FDE8E8"/>
            <path d="M14 10C14 8.89543 14.8954 8 16 8H28L36 16V38C36 39.1046 35.1046 40 34 40H16C14.8954 40 14 39.1046 14 38V10Z" fill="#FFFFFF" stroke="#E02424" stroke-width="2"/>
            <path d="M28 8V16H36" fill="#FBD5D5" stroke="#E02424" stroke-width="2" stroke-linejoin="round"/>
            <rect x="11" y="24" width="26" height="12" rx="3" fill="#E02424"/>
            <text x="24" y="33" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">PDF</text>
        </svg>
    </div>
</f:section>

            <path d="M14 10C14 8.89543 14.8954 8 16 8H28L36 16V38C36 39.1046 35.1046 40 34 40H16C14.8954 40 14 39.1046 14 38V10Z" fill="#FFFFFF" stroke="#00703A" stroke-width="2"/>

            <text x="24" y="33" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="0.5">{f:if(condition: extension, then: '{extension -> f:format.case(mode: \'upper\') -> f:format.crop(maxCharacters: 4, append: \'\')}', else: 'DOC')}</text>

</html>

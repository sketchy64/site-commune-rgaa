<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:rgaa="http://typo3.org/ns/Commune/SiteCommuneRgaa/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!-- Chargement dynamique de la disposition de l'en-tête et des paramètres de marque (Paramètres de site ou Constantes) -->
<f:variable name="communeHeaderLayout" value="{rgaa:siteSetting(key: 'commune.header_layout', default: communeHeaderLayout)}" />
<f:if condition="{communeHeaderLayout} == '1' || {communeHeaderLayout} == 'integrated'">
    <f:then><f:variable name="communeHeaderLayout" value="integrated" /></f:then>
    <f:else><f:variable name="communeHeaderLayout" value="standard" /></f:else>
</f:if>
<f:variable name="communeLogoFile" value="{rgaa:siteSetting(key: 'commune.logo_file', default: communeLogoFile)}" />
<f:variable name="communeLogoHeight" value="{rgaa:siteSetting(key: 'commune.logo_height', default: communeLogoHeight)}" />
<f:variable name="communeNom" value="{rgaa:siteSetting(key: 'commune.nom', default: communeNom)}" />
<f:variable name="communeSlogan" value="{rgaa:siteSetting(key: 'commune.slogan', default: communeSlogan)}" />
<f:variable name="communeHeaderHideTitle" value="{rgaa:siteSetting(key: 'commune.header_hide_title', default: communeHeaderHideTitle)}" />
<f:variable name="communeHeaderHideSlogan" value="{rgaa:siteSetting(key: 'commune.header_hide_slogan', default: communeHeaderHideSlogan)}" />
<f:variable name="communeSearchPageUid" value="{rgaa:siteSetting(key: 'commune.search_page_uid', default: communeSearchPageUid)}" />

<!-- Numéros d'urgence (Paramètres de site ou Constantes) -->
<f:variable name="communeUrgenceMairie" value="{rgaa:siteSetting(key: 'commune.urgence_mairie', default: communeUrgenceMairie)}" />
<f:variable name="communeSamu" value="{rgaa:siteSetting(key: 'commune.samu', default: communeSamu)}" />
<f:if condition="!{communeSamu}"><f:variable name="communeSamu" value="15" /></f:if>
<f:variable name="communePolice" value="{rgaa:siteSetting(key: 'commune.police', default: communePolice)}" />
<f:if condition="!{communePolice}"><f:variable name="communePolice" value="17" /></f:if>
<f:variable name="communePompiers" value="{rgaa:siteSetting(key: 'commune.pompiers', default: communePompiers)}" />
<f:if condition="!{communePompiers}"><f:variable name="communePompiers" value="18" /></f:if>
<f:variable name="communeUrgenceEuropeenne" value="{rgaa:siteSetting(key: 'commune.urgence_europeenne', default: communeUrgenceEuropeenne)}" />
<f:if condition="!{communeUrgenceEuropeenne}"><f:variable name="communeUrgenceEuropeenne" value="112" /></f:if>
<f:variable name="communeSourdsMalentendants" value="{rgaa:siteSetting(key: 'commune.sourds_malentendants', default: communeSourdsMalentendants)}" />
<f:if condition="!{communeSourdsMalentendants}"><f:variable name="communeSourdsMalentendants" value="114" /></f:if>

<!-- Chargement dynamique de la palette de couleurs sélectionnée (Paramètres de site ou Constantes) -->
<f:variable name="activeColorScheme" value="{rgaa:siteSetting(key: 'commune.color_scheme_css', default: communeColorScheme)}" />
<f:if condition="!{activeColorScheme}">
    <f:variable name="activeColorScheme" value="EXT:site_commune_rgaa/Resources/Public/Css/commune-couleurs-1.css" />
</f:if>
<f:if condition="{activeColorScheme} && {activeColorScheme} != 'none'">
    <f:asset.css identifier="commune-color-scheme" href="{activeColorScheme}" />
</f:if>

<!-- Chargement dynamique de la feuille de style du thème sélectionné (Paramètres de site ou Constantes) -->
<f:variable name="activeTheme" value="{rgaa:siteSetting(key: 'commune.theme_css', default: communeTheme)}" />
<f:if condition="{activeTheme} && {activeTheme} != 'none' && {activeTheme} != 'default'">
    <f:asset.css identifier="commune-theme" href="{activeTheme}" />
</f:if>

<!-- Liens d'évitement / Skip Links obligatoires RGAA 4.1.2 (Critère 12.7) -->
<f:render partial="Structure/SkipLinks" arguments="{_all}" />

<f:variable name="communePwaTopBannerEnable" value="{rgaa:siteSetting(key: 'commune.pwa_top_banner_enable', default: communePwaTopBannerEnable)}" />
<f:variable name="communePwaTopBannerText" value="{rgaa:siteSetting(key: 'commune.pwa_top_banner_text', default: communePwaTopBannerText)}" />
<f:variable name="communePwaTopBannerShowClose" value="{rgaa:siteSetting(key: 'commune.pwa_top_banner_show_close', default: communePwaTopBannerShowClose)}" />

<div id="top" class="site-wrapper d-flex flex-column min-vh-100">
    <!-- Bandeau supérieur PWA Mobile & Notifications Push (Paramétrable via commune.pwa_top_banner_enable) -->
    <f:render partial="Structure/PwaBanner" arguments="{_all}" />

    <!-- Barre d'outils d'accessibilité (Taille police, Contraste, Police dyslexie) -->
    <f:render partial="Accessibility/Toolbar" arguments="{_all}" />

    <!-- Panneau d'alerte citoyenne (entre la Barre d'outils et la Navigation principale sur les gabarits d'accueil) -->
    <f:render section="EmergencyAlert" optional="true" />

    <!-- En-tête institutionnel & navigation principale -->
    <f:render partial="Structure/Header" arguments="{_all}" />

    <!-- Contenu Principal (Landmark role="main") -->
    <main id="main-content" class="flex-grow-1" role="main" tabindex="-1">
        <f:render section="Main" />
    </main>

    <!-- Pied de page officiel avec mentions RGAA obligatoires -->
    <f:render partial="Structure/Footer" arguments="{_all}" />

    <!-- Bouton Retour en haut de page avec grande flèche visible et défilement fluide -->
    <button id="commune-back-to-top" class="commune-back-to-top btn btn-primary rounded-circle shadow" type="button" aria-label="Remonter en haut de la page" title="Remonter en haut de la page">
        <svg class="back-to-top-arrow" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>
</div>
</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:rgaa="http://typo3.org/ns/Commune/SiteCommuneRgaa/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!-- Chargement dynamique de la feuille de style du thème sélectionné (Paramètres de site ou Constantes) -->
<f:variable name="activeTheme" value="{communeTheme}" />
<f:if condition="!{activeTheme}">
    <f:variable name="activeTheme" value="{site.settings.get('commune.theme_css')}" />
</f:if>
<f:if condition="{activeTheme} && {activeTheme} != 'none' && {activeTheme} != 'default'">
    <f:asset.css identifier="commune-theme" href="{activeTheme}" priority="1" />
</f:if>

<!-- Liens d'évitement / Skip Links obligatoires RGAA 4.1.2 (Critère 12.7) -->
<f:render partial="Structure/SkipLinks" arguments="{_all}" />

<div id="top" class="site-wrapper d-flex flex-column min-vh-100">
    <!-- Barre d'outils d'accessibilité (Taille police, Contraste, Police dyslexie) -->
    <f:render partial="Accessibility/Toolbar" arguments="{_all}" />

    <!-- Bandeau d'alerte citoyenne (si contenu présent dans la colonne colPos 100) -->
    <f:if condition="{emergencyAlertContent}">
        <f:render partial="Structure/EmergencyAlert" arguments="{_all}" />
    </f:if>

    <!-- En-tête institutionnel & navigation principale -->
    <f:render partial="Structure/Header" arguments="{_all}" />

    <!-- Fil d'Ariane accessible (uniquement sur sous-pages, masqué sur la page d'accueil) -->
    <f:if condition="{rootLine -> f:count()} > 1">
        <f:render partial="Navigation/Breadcrumb" arguments="{_all}" />
    </f:if>

    <!-- Contenu Principal (Landmark role="main") -->
    <main id="main-content" class="flex-grow-1" role="main" tabindex="-1">
        <f:render section="Main" />
    </main>

    <!-- Pied de page officiel avec mentions RGAA obligatoires -->
    <f:render partial="Structure/Footer" arguments="{_all}" />

    <!-- Bouton Retour en haut de page avec grande flèche visible et défilement fluide -->
    <button id="commune-back-to-top" class="commune-back-to-top btn btn-primary rounded-circle shadow" type="button" aria-label="Remonter en haut de la page" title="Remonter en haut de la page">
        <svg class="back-to-top-arrow" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>
</div>
</html>

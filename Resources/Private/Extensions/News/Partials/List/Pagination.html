<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{paginator.numberOfPages} > 1">
    <nav class="commune-pagination-nav d-flex justify-content-center my-5" aria-label="Pagination des actualités">
        <ul class="pagination pagination-commune justify-content-center flex-wrap gap-2 mb-0" role="list">
            <!-- Bouton Précédent -->
            <f:if condition="{pagination.previousPageNumber}">
                <f:then>
                    <li class="page-item">
                        <f:link.action arguments="{currentPage: pagination.previousPageNumber}"
                                       class="page-link commune-page-btn"
                                       aria-label="Page précédente (page {pagination.previousPageNumber})">
                            <svg class="pagination-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                            <span class="d-none d-sm-inline ms-1">Précédent</span>
                        </f:link.action>
                    </li>
                </f:then>
                <f:else>
                    <li class="page-item disabled" aria-disabled="true">
                        <span class="page-link commune-page-btn disabled" aria-hidden="true">
                            <svg class="pagination-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                            <span class="d-none d-sm-inline ms-1">Précédent</span>
                        </span>
                    </li>
                </f:else>
            </f:if>

            <!-- Numéros de pages -->
            <f:for each="{pagination.allPageNumbers}" as="pageNumber">
                <f:if condition="{pageNumber} == {paginator.currentPageNumber}">
                    <f:then>
                        <li class="page-item active" aria-current="page">
                            <span class="page-link commune-page-btn active">
                                {pageNumber}
                                <span class="visually-hidden">(page actuelle)</span>
                            </span>
                        </li>
                    </f:then>
                    <f:else>
                        <li class="page-item">
                            <f:link.action arguments="{currentPage: pageNumber}"
                                           class="page-link commune-page-btn"
                                           aria-label="Aller à la page {pageNumber}">
                                {pageNumber}
                            </f:link.action>
                        </li>
                    </f:else>
                </f:if>
            </f:for>

            <!-- Bouton Suivant -->
            <f:if condition="{pagination.nextPageNumber}">
                <f:then>
                    <li class="page-item">
                        <f:link.action arguments="{currentPage: pagination.nextPageNumber}"
                                       class="page-link commune-page-btn"
                                       aria-label="Page suivante (page {pagination.nextPageNumber})">
                            <span class="d-none d-sm-inline me-1">Suivant</span>
                            <svg class="pagination-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </f:link.action>
                    </li>
                </f:then>
                <f:else>
                    <li class="page-item disabled" aria-disabled="true">
                        <span class="page-link commune-page-btn disabled" aria-hidden="true">
                            <span class="d-none d-sm-inline me-1">Suivant</span>
                            <svg class="pagination-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </span>
                    </li>
                </f:else>
            </f:if>
        </ul>
    </nav>
</f:if>
</html>

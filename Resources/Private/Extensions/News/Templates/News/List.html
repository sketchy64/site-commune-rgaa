<!--
    OVERRIDE: EXT:news/Resources/Private/Templates/News/List.html
    REASON: RGAA 4.1 Compliance & Pagination / FlexForm Settings Fix
    TARGET EXT VERSION: news ^11.0 || ^12.0 || ^13.0
-->
<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="General" />

<f:section name="content">
    <f:if condition="{news}">
        <f:then>
            <f:variable name="activeLayout" value="{f:if(condition: settings.templateLayout, then: settings.templateLayout, else: settings.listLayout)}" />
            <f:variable name="newsList" value="{f:if(condition: pagination.paginator, then: pagination.paginator.paginatedItems, else: news)}" />
            
            <f:switch expression="{activeLayout}">
                <f:case value="carousel">
                    <!-- Mode Carrousel défilant -->
                    <f:render partial="List/Carousel" arguments="{news: news, settings: settings, contentObjectData: contentObjectData}" />
                </f:case>

                <f:case value="rows">
                    <!-- Mode Liste en ligne (Image à gauche, texte à droite) -->
                    <div class="commune-news-list-container commune-news-list-rows">
                        <div class="row g-4">
                            <f:for each="{newsList}" as="newsItem" iteration="iterator">
                                <div class="col-12">
                                    <f:render partial="List/ItemRow" arguments="{newsItem: newsItem, settings: settings, iterator: iterator}" />
                                </div>
                            </f:for>
                        </div>

                        <!-- Pagination accessible RGAA -->
                        <f:if condition="{pagination}">
                            <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator, actionName: 'list'}" />
                        </f:if>
                    </div>
                </f:case>

                <f:defaultCase>
                    <!-- Mode par défaut : En colonnes / Grille de cartes -->
                    <div class="commune-news-list-container commune-news-list-cards">
                        <div class="row g-4">
                            <f:for each="{newsList}" as="newsItem" iteration="iterator">
                                <div class="col-lg-4 col-md-6 col-12 d-flex">
                                    <f:render partial="List/Item" arguments="{newsItem: newsItem, settings: settings, iterator: iterator}" />
                                </div>
                            </f:for>
                        </div>

                        <!-- Pagination accessible RGAA -->
                        <f:if condition="{pagination}">
                            <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator, actionName: 'list'}" />
                        </f:if>
                    </div>
                </f:defaultCase>
            </f:switch>
        </f:then>
        <f:else>
            <div class="alert alert-info d-flex align-items-center gap-2" role="status">
                <svg class="flex-shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <span><f:translate key="list_nonewsfound" default="Aucune actualité disponible pour le moment." /></span>
            </div>
        </f:else>
    </f:if>
</f:section>
</html>

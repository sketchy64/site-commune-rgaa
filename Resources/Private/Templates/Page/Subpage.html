<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <!-- Bandeau d'en-tête pleine largeur : Hero - Titre - Fil d'Ariane -->
    <f:render partial="Structure/PageHero" arguments="{_all}" />

    <div class="container my-4">
        <div class="row g-4">
            <!-- Barre latérale / Navigation de rubrique (Landmark role="complementary") -->
            <aside class="col-lg-3 col-md-4 mb-4" role="complementary" aria-label="Navigation de la rubrique">
                <div class="card border-0 shadow-sm mb-4 commune-sidebar-card">
                    <div class="card-header bg-primary-commune text-white fw-bold py-2.5 px-3 d-flex align-items-center">
                        <svg class="me-2 flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                        <span>Dans cette rubrique</span>
                    </div>
                    <div class="card-body p-0">
                        <f:if condition="{subMenuItems}">
                            <f:then>
                                <ul class="list-group list-group-flush commune-sidebar-menu level-1">
                                    <f:for each="{subMenuItems}" as="subItem">
                                        <li class="list-group-item level-1-item{f:if(condition: subItem.children, then: ' has-children')}{f:if(condition: subItem.active, then: ' active-page')}">
                                            <a href="{subItem.link}" class="sidebar-link level-1-link{f:if(condition: subItem.children, then: ' is-parent')}{f:if(condition: subItem.active, then: ' active-link')}"{f:if(condition: subItem.current, then: ' aria-current="page"', else: '{f:if(condition: subItem.active, then: \' aria-current="true"\')}')}>
                                                <f:if condition="{subItem.children}">
                                                    <f:then>
                                                        <span class="sidebar-title-text">{subItem.title}</span>
                                                    </f:then>
                                                    <f:else>
                                                        {subItem.title}
                                                    </f:else>
                                                </f:if>
                                            </a>
                                            <f:if condition="{subItem.children} && {subItem.active}">
                                                <ul class="commune-sidebar-submenu level-2 list-unstyled mb-0">
                                                    <f:for each="{subItem.children}" as="l2Item">
                                                        <li class="sidebar-subitem level-2-item{f:if(condition: l2Item.children, then: ' has-children')}{f:if(condition: l2Item.active, then: ' active-page')}">
                                                            <a href="{l2Item.link}" class="sidebar-sublink level-2-link{f:if(condition: l2Item.children, then: ' is-parent')}{f:if(condition: l2Item.active, then: ' active-link')}"{f:if(condition: l2Item.current, then: ' aria-current="page"', else: '{f:if(condition: l2Item.active, then: \' aria-current="true"\')}')}>
                                                                <span class="sidebar-item-text">{l2Item.title}</span>
                                                            </a>
                                                            <f:if condition="{l2Item.children} && {l2Item.active}">
                                                                <ul class="commune-sidebar-subsubmenu level-3 list-unstyled mb-0">
                                                                    <f:for each="{l2Item.children}" as="l3Item">
                                                                        <li class="sidebar-subsubitem level-3-item{f:if(condition: l3Item.active, then: ' active-page')}">
                                                                            <a href="{l3Item.link}" class="sidebar-subsublink level-3-link{f:if(condition: l3Item.active, then: ' active-link')}"{f:if(condition: l3Item.current, then: ' aria-current="page"')}>
                                                                                <span class="sidebar-item-text">{l3Item.title}</span>
                                                                            </a>
                                                                        </li>
                                                                    </f:for>
                                                                </ul>
                                                            </f:if>
                                                        </li>
                                                    </f:for>
                                                </ul>
                                            </f:if>
                                        </li>
                                    </f:for>
                                </ul>
                            </f:then>
                            <f:else>
                                <f:format.raw>{subNavigation}</f:format.raw>
                            </f:else>
                        </f:if>
                    </div>
                </div>

                <!-- Contenu additionnel colonne latérale rétrocompatible (colPos 200) -->
                <f:if condition="{sidebarLeftContent}">
                    <div class="commune-sidebar-extra">
                        <f:format.raw>{sidebarLeftContent}</f:format.raw>
                    </div>
                </f:if>
            </aside>

            <!-- Corps de la page : 8 rangées de contenu modulables (100% et 50%/50% alternés) -->
            <article class="col-lg-9 col-md-8 commune-page-content">
                <f:render partial="Structure/ContentRows" arguments="{_all}" />
            </article>
        </div>
    </div>
</f:section>
</html>

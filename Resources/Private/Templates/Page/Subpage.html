<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <div class="container my-4">
        <div class="row">
            <!-- Barre latérale / Navigation de rubrique (Landmark role="complementary") -->
            <aside class="col-lg-3 col-md-4 mb-4" role="complementary" aria-label="Navigation de la rubrique">
                <div class="card border-0 shadow-sm mb-4 commune-sidebar-card">
                    <div class="card-header bg-primary-commune text-white fw-bold py-2.5 px-3 d-flex align-items-center">
                        <svg class="me-2 flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                        <span>Dans cette rubrique</span>
                    </div>
                    <div class="card-body p-0">
                        <f:format.raw>{subNavigation}</f:format.raw>
                    </div>
                </div>

                <!-- Contenu additionnel colonne latérale (colPos 200) -->
                <f:if condition="{sidebarLeftContent}">
                    <div class="commune-sidebar-extra">
                        <f:format.raw>{sidebarLeftContent}</f:format.raw>
                    </div>
                </f:if>
            </aside>

            <!-- Corps de la page (Article principal) -->
            <article class="col-lg-9 col-md-8">
                <!-- Titre H1 unique de la page avec même style que les H2 de l'accueil -->
                <div class="mb-4">
                    <h1 class="page-title commune-section-title mb-0">{data.title}</h1>
                </div>

                <f:if condition="{data.subtitle}">
                    <p class="lead text-muted mb-4">{data.subtitle}</p>
                </f:if>

                <!-- Contenu principal (colPos 0) -->
                <div class="commune-page-content">
                    <f:format.raw>{mainContent}</f:format.raw>
                </div>
            </article>
        </div>
    </div>
</f:section>
</html>

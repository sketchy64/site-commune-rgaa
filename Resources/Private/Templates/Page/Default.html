<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <!-- Bandeau d'en-tête pleine largeur : Hero - Titre - Fil d'Ariane -->
    <f:render partial="Structure/PageHero" arguments="{_all}" />

    <div class="container my-4">
        <!-- Corps de la page pleine largeur : 8 rangées de contenu modulables (100% et 50%/50% alternés) -->
        <article class="commune-full-page commune-page-content">
            <f:render partial="Structure/ContentRows" arguments="{_all}" />
        </article>
    </div>
</f:section>
</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="EmergencyAlert">
    <!-- Panneau d'alerte (colPos 100 - affiché entre la Barre d'outils et la Navigation principale) -->
    <f:if condition="{emergencyAlertContent}">
        <f:render partial="Structure/EmergencyAlert" arguments="{_all}" />
    </f:if>
</f:section>

<f:section name="Main">
    <!-- Titre principal masqué de premier niveau (Critère 9.1 RGAA - 1 seul H1 sur l'accueil) -->
    <h1 class="visually-hidden">Bienvenue sur le portail officiel de la commune de {communeNom}</h1>

    <!-- 1. Diaporama d'images sous la navigation principale (colPos 110 - Pleine largeur) -->
    <f:if condition="{heroContent}">
        <section class="commune-home-section commune-hero-section p-0 m-0 position-relative"
            aria-label="Diaporama d'images et actualités à la une">
            <div class="container-fluid px-0">
                <f:format.raw>{heroContent}</f:format.raw>
            </div>
            <f:if condition="{communeHomeHeroSearchEnable}">
                <div class="commune-hero-search-overlay d-none d-md-block position-absolute start-50 translate-middle-x w-100 px-3" style="z-index: 10; max-width: 680px;">
                    <div class="card border-0 shadow-lg p-3 p-md-4 bg-white-overlay rounded-4 text-center">
                        <h2 class="h4 mt-0 mb-3 text-dark fw-bold">{f:translate(key: 'hero.search.title', extensionName: 'site_commune_rgaa')}</h2>
                        <form class="commune-hero-search-form" role="search" method="get" action="{f:uri.page(pageUid: communeSearchPageUid)}">
                            <div class="input-group input-group-lg">
                                <label for="hero-search-input" class="visually-hidden">
                                    {f:translate(key: 'nav.search.label', extensionName: 'site_commune_rgaa')}
                                </label>
                                <input type="search" id="hero-search-input" name="tx_indexedsearch_pi2[search][sword]" class="form-control rounded-start-pill ps-4" placeholder="{f:translate(key: 'hero.search.placeholder', extensionName: 'site_commune_rgaa')}" aria-label="{f:translate(key: 'nav.search.label', extensionName: 'site_commune_rgaa')}" required>
                                <button class="btn btn-primary rounded-end-pill px-4 d-flex align-items-center justify-content-center" type="submit" aria-label="{f:translate(key: 'nav.search.button', extensionName: 'site_commune_rgaa')}">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    </svg>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </f:if>
        </section>
    </f:if>

    <!-- 2. Accès rapides / Démarches citoyennes (colPos 120) -->
    <f:if condition="{quickAccessContent}">
        <section class="commune-home-section commune-quickaccess-section commune-section-content py-5"
            aria-label="Accès rapides">
            <div class="container">
                <div class="commune-quickaccess-wrapper">
                    <f:format.raw>{quickAccessContent}</f:format.raw>
                </div>
            </div>
        </section>
    </f:if>

    <!-- 3. Grille de contenu — Gabarit Accueil 2 (Contenu principal 100% + Contenu 2/3 gauche & Contenu 1/3 droite) -->
    <!-- Rangée 1 : Contenu principal (100% - colPos 0) -->
    <f:if condition="{mainContent}">
        <section class="commune-home-section commune-main-content-section commune-section-content py-4" aria-label="Contenu principal">
            <div class="container">
                <f:format.raw>{mainContent}</f:format.raw>
            </div>
        </section>
    </f:if>

    <!-- Rangée 2 : Contenu large (2/3 - colPos 11) | Contenu colonne droite (1/3 - colPos 12) -->
    <f:if condition="{contentRow2Col1} || {contentRow2Col2}">
        <div class="commune-home-section commune-content-asymmetric-row commune-section-content py-4">
            <div class="container">
                <div class="row g-4">
                    <div class="col-12 col-lg-8">
                        <f:format.raw>{contentRow2Col1}</f:format.raw>
                    </div>
                    <aside class="col-12 col-lg-4" aria-label="Informations complémentaires">
                        <f:format.raw>{contentRow2Col2}</f:format.raw>
                    </aside>
                </div>
            </div>
        </div>
    </f:if>

    <!-- 4. Zone automatique de bas d'accueil : Plan du site (- Pied de page) -->

    <f:if condition="{communeHomeSitemapEnable}">
        <section class="commune-home-section commune-sitemap-section commune-section-content py-5"
            aria-label="{f:if(condition: communeHomeSitemapTitle, then: communeHomeSitemapTitle, else: 'Plan du site & Navigation')}">
            <div class="container">
                <f:if condition="!{communeHomeSitemapHideTitle}">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h3 mb-0 commune-section-title">
                            <f:if condition="{communeHomeSitemapTitle}">
                                <f:then>{communeHomeSitemapTitle}</f:then>
                                <f:else>Plan du site &amp; Navigation</f:else>
                            </f:if>
                        </h2>
                    </div>
                </f:if>
                <div class="commune-sitemap-wrapper">
                    <f:render partial="Navigation/Sitemap" arguments="{_all}" />
                </div>
            </div>
        </section>
    </f:if>
</f:section>

</html>

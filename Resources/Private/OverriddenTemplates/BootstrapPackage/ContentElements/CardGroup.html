<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:bk2k="http://typo3.org/ns/BK2K/BootstrapPackage/ViewHelpers"
      xmlns:rgaa="http://typo3.org/ns/Commune/SiteCommuneRgaa/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <f:if condition="{records}">
        <!-- Détermination dynamique du nombre de colonnes de la grille -->
        <f:variable name="cardColumnsClass" value="row-cols-1 row-cols-md-2 row-cols-lg-3" />
        <f:variable name="colsCount" value="{data.imagecols -> f:or(alternative: options.columns -> f:or(alternative: data.cols))}" />
        <f:switch expression="{colsCount}">
            <f:case value="1"><f:variable name="cardColumnsClass" value="row-cols-1" /></f:case>
            <f:case value="2"><f:variable name="cardColumnsClass" value="row-cols-1 row-cols-md-2" /></f:case>
            <f:case value="3"><f:variable name="cardColumnsClass" value="row-cols-1 row-cols-md-2 row-cols-lg-3" /></f:case>
            <f:case value="4"><f:variable name="cardColumnsClass" value="row-cols-1 row-cols-md-2 row-cols-lg-4" /></f:case>
            <f:case value="6"><f:variable name="cardColumnsClass" value="row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-6" /></f:case>
        </f:switch>

        <!-- Détermination dynamique de l'alignement du texte (header_position) -->
        <f:variable name="cardTextAlignClass" value="text-start" />
<<<<<<< HEAD
        <f:variable name="cardButtonAlignClass" value="text-start" />
        <f:variable name="headerPos" value="{data.header_position -> f:or(alternative: options.header_position)}" />
        <f:if condition="{headerPos} == 'center' || {headerPos} == '2'">
            <f:variable name="cardTextAlignClass" value="text-center align-items-center" />
            <f:variable name="cardButtonAlignClass" value="text-center" />
        </f:if>
        <f:if condition="{headerPos} == 'right' || {headerPos} == '3'">
            <f:variable name="cardTextAlignClass" value="text-end align-items-end" />
            <f:variable name="cardButtonAlignClass" value="text-end" />
        </f:if>

        <div class="row {cardColumnsClass} g-4 commune-card-group">
            <f:for each="{records}" as="record">
                <div class="col">
                    <div class="card h-100 shadow-sm border-0 commune-card {cardTextAlignClass}">
                        <f:if condition="{record.image.0}">
                            <f:variable name="image" value="{record.image.0}" />
                            <f:if condition="{image.alternative}">
                                <f:then>
                                    <f:image image="{image}"
                                             class="card-img-top"
                                             title="{image.title}"
                                             alt="{image.alternative}" />
                                </f:then>
                                <f:else>
                                    <f:image image="{image}"
                                             class="card-img-top"
                                             title="{image.title}"
                                             alt=""
                                             additionalAttributes="{role: 'presentation', aria-hidden: 'true'}" />
                                </f:else>
                            </f:if>
                        </f:if>

                        <div class="card-body d-flex flex-column {cardTextAlignClass}">
                            <h3 class="card-title h5 text-primary-commune">{record.data.header}</h3>
                            <f:if condition="{record.data.subheader}">
                                <h4 class="card-subtitle mb-2 text-muted h6">{record.data.subheader}</h4>
                            </f:if>
                            <f:if condition="{record.data.bodytext}">
                                <div class="card-text mb-3">
                                    <f:format.html>{record.data.bodytext}</f:format.html>
                                </div>
                            </f:if>

                            <f:if condition="{record.data.link}">
                                <div class="mt-auto w-100 {cardButtonAlignClass}">
                                    <f:variable name="cardAriaLabel" value="{rgaa:a11y.ariaLabel(action: 'En savoir plus sur', context: record.data.header)}" />
                                    <f:link.typolink parameter="{record.data.link}"
                                                     class="btn btn-outline-primary btn-sm stretched-link"
                                                     additionalAttributes="{aria-label: cardAriaLabel}">
                                        <f:if condition="{record.data.link_title}">
                                            <f:then>{record.data.link_title}</f:then>
                                            <f:else>En savoir plus</f:else>
                                        </f:if>
                                    </f:link.typolink>
                                </div>
                            </f:if>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:if>
</f:section>
</html>

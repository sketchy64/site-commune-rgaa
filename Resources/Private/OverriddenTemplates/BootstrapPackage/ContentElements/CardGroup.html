<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:bk2k="http://typo3.org/ns/BK2K/BootstrapPackage/ViewHelpers"
      xmlns:rgaa="http://typo3.org/ns/Commune/SiteCommuneRgaa/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <f:if condition="{records}">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 commune-card-group">
            <f:for each="{records}" as="record">
                <div class="col">
                    <div class="card h-100 shadow-sm border-0 commune-card">
                        <f:if condition="{record.image.0}">
                            <f:variable name="image" value="{record.image.0}" />
                            <f:image image="{image}"
                                     class="card-img-top"
                                     title="{image.title}"
                                     additionalAttributes="{rgaa:a11y.decorativeImage(alt: image.alternative, isDecorative: false)}" />
                        </f:if>

                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title h5 text-primary-commune">{record.data.header}</h3>
                            <f:if condition="{record.data.subheader}">
                                <h4 class="card-subtitle mb-2 text-muted h6">{record.data.subheader}</h4>
                            </f:if>
                            <f:if condition="{record.data.bodytext}">
                                <div class="card-text mb-3">
                                    <f:format.html>{record.data.bodytext}</f:format.html>
                                </div>
                            </f:if>

                            <f:if condition="{record.data.link}">
                                <div class="mt-auto">
                                    <f:link.typolink parameter="{record.data.link}"
                                                     class="btn btn-outline-primary btn-sm stretched-link"
                                                     additionalAttributes="{aria-label: '{rgaa:a11y.ariaLabel(action: \'En savoir plus sur\', context: record.data.header)}'}">
                                        <f:if condition="{record.data.link_title}">
                                            <f:then>{record.data.link_title}</f:then>
                                            <f:else>En savoir plus</f:else>
                                        </f:if>
                                    </f:link.typolink>
                                </div>
                            </f:if>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:if>
</f:section>
</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:bk2k="http://typo3.org/ns/BK2K/BootstrapPackage/ViewHelpers"
      xmlns:rgaa="http://typo3.org/ns/Commune/SiteCommuneRgaa/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!--
    OVERRIDE: EXT:bootstrap_package/Resources/Private/Templates/ContentElements/CardGroup.html
    REASON: RGAA 4.1 Compliance & Page-level Grid Alignment Fix for Card Group
    TARGET EXT VERSION: bootstrap_package ^14.0 || ^15.0 || ^16.0
-->

<f:layout name="Default" />

<f:section name="Main">
    <f:if condition="{records}">
        <!-- Détermination dynamique du nombre de colonnes de la grille (columns / cols / imagecols) -->
        <f:variable name="colsCount" value="" />
        <f:if condition="{options.columns}">
            <f:then><f:variable name="colsCount" value="{options.columns}" /></f:then>
            <f:else><f:if condition="{data.pi_flexform.columns}">
                <f:then><f:variable name="colsCount" value="{data.pi_flexform.columns}" /></f:then>
                <f:else><f:if condition="{flexform.columns}">
                    <f:then><f:variable name="colsCount" value="{flexform.columns}" /></f:then>
                    <f:else><f:if condition="{pi_flexform.columns}">
                        <f:then><f:variable name="colsCount" value="{pi_flexform.columns}" /></f:then>
                        <f:else><f:if condition="{data.pi_flexform.data.sDEF.lDEF.columns.vDEF}">
                            <f:then><f:variable name="colsCount" value="{data.pi_flexform.data.sDEF.lDEF.columns.vDEF}" /></f:then>
                            <f:else><f:if condition="{options.cols}">
                                <f:then><f:variable name="colsCount" value="{options.cols}" /></f:then>
                                <f:else><f:if condition="{options.card_columns}">
                                    <f:then><f:variable name="colsCount" value="{options.card_columns}" /></f:then>
                                    <f:else><f:if condition="{data.cols} && {data.cols} > 0">
                                        <f:then><f:variable name="colsCount" value="{data.cols}" /></f:then>
                                        <f:else><f:if condition="{options.imagecols}">
                                            <f:then><f:variable name="colsCount" value="{options.imagecols}" /></f:then>
                                            <f:else><f:if condition="{data.imagecols} && {data.imagecols} > 1">
                                                <f:then><f:variable name="colsCount" value="{data.imagecols}" /></f:then>
                                            </f:if></f:else>
                                        </f:if></f:else>
                                    </f:if></f:else>
                                </f:if></f:else>
                            </f:if></f:else>
                        </f:if></f:else>
                    </f:if></f:else>
                </f:if></f:else>
            </f:if></f:else>
        </f:if>

        <f:variable name="cardColumnsClass" value="row-cols-1 row-cols-md-2 row-cols-lg-3" />
        <f:switch expression="{colsCount}">
            <f:case value="1"><f:variable name="cardColumnsClass" value="row-cols-1" /></f:case>
            <f:case value="2"><f:variable name="cardColumnsClass" value="row-cols-1 row-cols-md-2" /></f:case>
            <f:case value="3"><f:variable name="cardColumnsClass" value="row-cols-1 row-cols-md-2 row-cols-lg-3" /></f:case>
            <f:case value="4"><f:variable name="cardColumnsClass" value="row-cols-1 row-cols-md-2 row-cols-lg-4" /></f:case>
            <f:case value="6"><f:variable name="cardColumnsClass" value="row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-6" /></f:case>
        </f:switch>

        <!-- Détermination dynamique de l'alignement du groupe de cartes sur la page (justify-content-*) -->
        <f:variable name="headerPos" value="" />
        <f:if condition="{options.align}">
            <f:then><f:variable name="headerPos" value="{options.align}" /></f:then>
            <f:else><f:if condition="{data.pi_flexform.align}">
                <f:then><f:variable name="headerPos" value="{data.pi_flexform.align}" /></f:then>
                <f:else><f:if condition="{flexform.align}">
                    <f:then><f:variable name="headerPos" value="{flexform.align}" /></f:then>
                    <f:else><f:if condition="{pi_flexform.align}">
                        <f:then><f:variable name="headerPos" value="{pi_flexform.align}" /></f:then>
                        <f:else><f:if condition="{data.pi_flexform.data.sDEF.lDEF.align.vDEF}">
                            <f:then><f:variable name="headerPos" value="{data.pi_flexform.data.sDEF.lDEF.align.vDEF}" /></f:then>
                            <f:else><f:if condition="{options.header_position}">
                                <f:then><f:variable name="headerPos" value="{options.header_position}" /></f:then>
                                <f:else><f:if condition="{options.alignment}">
                                    <f:then><f:variable name="headerPos" value="{options.alignment}" /></f:then>
                                    <f:else><f:if condition="{options.text_alignment}">
                                        <f:then><f:variable name="headerPos" value="{options.text_alignment}" /></f:then>
                                        <f:else><f:if condition="{data.header_position}">
                                            <f:then><f:variable name="headerPos" value="{data.header_position}" /></f:then>
                                            <f:else><f:if condition="{data.subheader_position}">
                                                <f:then><f:variable name="headerPos" value="{data.subheader_position}" /></f:then>
                                                <f:else><f:if condition="{data.alignment}">
                                                    <f:then><f:variable name="headerPos" value="{data.alignment}" /></f:then>
                                                </f:if></f:else>
                                            </f:if></f:else>
                                        </f:if></f:else>
                                    </f:if></f:else>
                                </f:if></f:else>
                            </f:if></f:else>
                        </f:if></f:else>
                    </f:if></f:else>
                </f:if></f:else>
            </f:if></f:else>
        </f:if>

        <f:variable name="gridJustifyClass" value="" />
        <f:if condition="{headerPos} == 'center' || {headerPos} == '2' || {headerPos} == 'middle' || {headerPos} == 'center-align'">
            <f:variable name="gridJustifyClass" value="justify-content-center" />
        </f:if>
        <f:if condition="{headerPos} == 'right' || {headerPos} == '3' || {headerPos} == 'end' || {headerPos} == 'right-align'">
            <f:variable name="gridJustifyClass" value="justify-content-end" />
        </f:if>

        <div class="row {cardColumnsClass} {gridJustifyClass} g-4 commune-card-group">
            <f:for each="{records}" as="record">
                <div class="col">
                    <div class="commune-card commune-card-person h-100 d-flex flex-column align-items-center">
                        <f:if condition="{record.image.0}">
                            <f:variable name="image" value="{record.image.0}" />
                            <div class="commune-card-avatar-wrapper text-center mx-auto">
                                <f:if condition="{image.alternative}">
                                    <f:then>
                                        <f:image image="{image}"
                                                 class="card-img-top card-img-circle card-img-avatar"
                                                 title="{image.title}"
                                                 alt="{image.alternative}" />
                                    </f:then>
                                    <f:else>
                                        <f:image image="{image}"
                                                 class="card-img-top card-img-circle card-img-avatar"
                                                 title="{image.title}"
                                                 alt=""
                                                 additionalAttributes="{role: 'presentation', aria-hidden: 'true'}" />
                                    </f:else>
                                </f:if>
                            </div>
                        </f:if>

                        <div class="card-body d-flex flex-column align-items-center text-center w-100 flex-grow-1">
                            <h3 class="card-title h5">{record.data.header}</h3>
                            <f:if condition="{record.data.subheader}">
                                <h4 class="card-subtitle mb-2 h6">{record.data.subheader}</h4>
                            </f:if>
                            <f:if condition="{record.data.bodytext}">
                                <div class="card-text mb-3">
                                    <f:format.html>{record.data.bodytext}</f:format.html>
                                </div>
                            </f:if>

                            <f:if condition="{record.data.link}">
                                <div class="mt-auto w-100 pt-2">
                                    <f:variable name="cardAriaLabel" value="{rgaa:a11y.ariaLabel(action: 'En savoir plus sur', context: record.data.header)}" />
                                    <f:link.typolink parameter="{record.data.link}"
                                                     class="btn btn-outline-primary btn-sm stretched-link commune-card-btn"
                                                     additionalAttributes="{aria-label: cardAriaLabel}">
                                        <f:if condition="{record.data.link_title}">
                                            <f:then>{record.data.link_title}</f:then>
                                            <f:else>En savoir plus</f:else>
                                        </f:if>
                                    </f:link.typolink>
                                </div>
                            </f:if>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:if>
</f:section>
</html>

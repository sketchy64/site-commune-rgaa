<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:bk2k="http://typo3.org/ns/BK2K/BootstrapPackage/ViewHelpers"
      xmlns:rgaa="http://typo3.org/ns/Commune/SiteCommuneRgaa/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!--
    OVERRIDE: EXT:bootstrap_package/Resources/Private/Templates/ContentElements/MenuCardAbstract.html
    REASON: RGAA 4.1 Compliance & Harmonized Card Menu Design
    TARGET EXT VERSION: bootstrap_package ^14.0 || ^15.0 || ^16.0
-->

<f:layout name="Default" />

<f:section name="Main">
    <f:if condition="{menu}">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 commune-card-group card-group-menu">
            <f:for each="{menu}" as="item">
                <div class="col">
                    <article class="card commune-card-menu card-menu h-100 border-0 shadow-sm overflow-hidden d-flex flex-column" aria-labelledby="card-menu-title-{item.data.uid}">
                        <f:if condition="{item.files.0}">
                            <f:then>
                                <f:media file="{item.files.0}" width="500c" height="280c" class="card-img-top card-menu-image" alt="{f:if(condition: item.files.0.alternative, then: item.files.0.alternative, else: item.title)}" />
                            </f:then>
                            <f:else>
                                <f:if condition="{item.icon}">
                                    <div class="p-4 pb-0 text-center">
                                        <div class="card-menu-icon-wrapper mx-auto">
                                            <bk2k:icon icon="{item.icon}" width="32" height="32" />
                                        </div>
                                    </div>
                                </f:if>
                            </f:else>
                        </f:if>

                        <div class="card-body p-4 d-flex flex-column flex-grow-1">
                            <h3 id="card-menu-title-{item.data.uid}" class="h5 card-title mb-3 fw-bold">
                                <f:link.typolink parameter="{item.link}" class="text-decoration-none card-menu-link stretched-link" title="{item.title}">
                                    {item.title}
                                </f:link.typolink>
                            </h3>

                            <f:if condition="{item.data.abstract}">
                                <div class="card-text text-muted mb-4 flex-grow-1 card-menu-abstract">
                                    <f:format.crop maxCharacters="160" append="...">{item.data.abstract}</f:format.crop>
                                </div>
                            </f:if>

                            <div class="mt-auto pt-2">
                                <f:variable name="btnAriaLabel" value="{rgaa:a11y.ariaLabel(action: 'Découvrir la rubrique', context: item.title)}" />
                                <span class="btn btn-outline-primary btn-sm card-menu-btn d-inline-flex align-items-center gap-2" aria-hidden="true">
                                    Découvrir
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </article>
                </div>
            </f:for>
        </div>
    </f:if>
</f:section>
</html>
